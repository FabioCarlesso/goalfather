# Competições do pack e os clubes de cada uma (issue #127).
#
# Arquivo CURADO, lido pelo importador (`./gradlew worldImport`, ver
# docs/WORLD_DATA.md). Os fatos de cada clube (nome, estádio, capacidade) e
# os elencos vêm do Wikidata; o que fica aqui é o que o Wikidata não responde
# bem:
#
# - QUAIS clubes disputam cada competição na temporada. As temporadas do
#   Wikidata quase nunca têm a lista de participantes (`P1923`) preenchida, e o
#   `P118` (liga) dos clubes mistura temporadas antigas. A lista abaixo foi
#   conferida no artigo da temporada na Wikipédia em inglês (campo `reference`)
#   e cada clube é amarrado ao seu item do Wikidata (`wikidata`).
# - Os ids do pack (`bra-flamengo`): estáveis entre importações, nunca
#   derivados do nome (que pode mudar).
# - O nome de EXIBIÇÃO (`name`, "Flamengo"): o rótulo do Wikidata é o nome
#   oficial ("Clube de Regatas do Flamengo") e o nome curto (`P1813`) costuma
#   ser sigla ("ECB", "OL"). Sem `name`, vale o rótulo do Wikidata.
# - Formato, desempate, divisão e força da liga: regras do JOGO, decisão nossa.
#   `competition` tem exatamente o formato de um item de competitions.json.
#
# Um clube SEM `wikidata` é uma referência a um clube definido em outra
# competição (os brasileiros na Libertadores). Clube de outro país que não o da
# competição informa `country` (trigrama FIFA).

import:
  # Data de referência do mundo: idade dos jogadores gerados e corte de vínculos.
  referenceDate: 2026-07-01
  # Vínculo (P54) só conta como atual se começou a partir daqui (ver docs).
  minMembershipStart: 2019-01-01
  # Jogadores nascidos antes disso são tratados como aposentados.
  minBirthDate: 1984-01-01
  minSquadSize: 22
  minGoalkeepers: 2
  # Seed do preenchimento de elencos: muda só se quisermos outros gerados.
  seed: 127

