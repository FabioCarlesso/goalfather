openapi: 3.1.0
info:
  title: GoalFather API
  version: 0.1.0
  description: |
    Contrato compartilhado entre o backend (Kotlin + Spring Boot) e o frontend
    (Vite + React + TypeScript). Esta é a fonte de verdade dos tipos da API.

    - **Backend:** o teste `ContractDriftTest` (backend/src/test) carrega este
      arquivo e falha se alguma operação HTTP `/api/**` não tiver handler
      Spring com o mesmo método + path, ou se algum handler `/api/**` não
      estiver documentado aqui (paths `/ws/**` são WebSocket e ficam de fora).
      O formato dos payloads é coberto pelos testes `*MvcTest` de cada
      endpoint. `sealed interface MatchEvent` em Kotlin é serializado com
      `@JsonClassDiscriminator("type")` (kotlinx.serialization), mapeando
      diretamente para `oneOf + discriminator` aqui.
    - **Frontend:** `openapi-typescript` gera `src/api/generated.d.ts` a partir
      deste arquivo. Mocks MSW e cliente HTTP usam esses tipos.

    Mudanças no contrato são feitas aqui PRIMEIRO; backend e frontend ajustam
    suas implementações para acompanhar.

    **Dinheiro:** todo valor monetário é um inteiro em **centavos de dólar
    (USD)** — `1000` = US$ 10,00 (issue #122). Não há câmbio nem outra moeda.
  license:
    name: MIT
    identifier: MIT
  contact:
    name: Fabio Carlesso
    email: fabio.carlesso@gmail.com

servers:
  - url: /
    description: Mesma origem — Swagger UI servido pelo backend (`/swagger-ui.html`)
  - url: http://localhost:8080
    description: Backend Spring Boot local (bootRun)
  - url: http://localhost:5173
    description: Frontend Vite com MSW interceptando (dev mock)

# Segurança padrão de TODAS as operações (espelha o `authorize("/api/**",
# authenticated)` do SecurityConfig). Sem este bloco global, só as operações
# com `security` próprio declaravam o JWT — e o "Authorize" do Swagger UI não
# mandava o header no resto, devolvendo 401 em todo "Try it out". As rotas
# públicas (register/login) e os WebSockets (token na query) sobrescrevem com
# `security: []`.
security:
  - bearerAuth: []

tags:
  - name: Auth
    description: Cadastro, login e identidade do usuário (JWT)
  - name: Club
    description: Estado e gestão do clube do usuário
  - name: Match
    description: Disputa e streaming de partidas
  - name: Market
    description: Mercado de transferências
  - name: Stadium
    description: Infraestrutura do clube
  - name: Medical
    description: Departamento médico — recuperação de fadiga e lesões
  - name: Training
    description: Treino semanal — foco escolhido pelo técnico entre rodadas
  - name: World
    description: Mundo do jogo — países, ligas e clubes para o onboarding (issue #131)
  - name: League
    description: Tabela e calendário do campeonato
  - name: Cup
    description: Copa mata-mata paralela ao campeonato
  - name: Board
    description: Diretoria — meta da temporada, confiança no técnico e demissão
  - name: Offers
    description: Propostas de transferência entre técnicos humanos
  # --- #132 Libertadores ---
  - name: Libertadores
    description: Copa Libertadores — fase de grupos, mata-mata e final única (issue #132)
  # --- #134 Seleções ---
  - name: NationalTeams
    description: Seleções nas datas FIFA — convocações, Eliminatórias e ranking (issue #134)

paths:
  /api/auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Cadastrar novo usuário
      description: |
        Cria um usuário com senha (hash BCrypt no backend) e devolve um JWT
        já autenticado. O usuário nasce sem clube (`clubId = null`) — o
        próximo passo é reivindicar um clube em `/api/clubs/{id}/claim`.
      security: []   # público: é aqui que o JWT nasce
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Usuário criado e autenticado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: Username já em uso (`USERNAME_TAKEN`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Autenticar usuário existente
      security: []   # público: é aqui que o JWT nasce
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Autenticado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Credenciais inválidas (`INVALID_CREDENTIALS`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: Identidade do usuário autenticado
      description: |
        Recupera o usuário a partir do JWT no header `Authorization`.
        Usado pelo frontend para restaurar a sessão após refresh e decidir
        se redireciona para `/select-club` (quando `clubId == null`).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Usuário autenticado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthUser' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/world/countries:
    get:
      tags: [World]
      operationId: listWorldCountries
      summary: Países do mundo e as ligas de cada um (onboarding, issue #131)
      description: |
        Primeiro passo do onboarding (país → liga → clube): os países que têm
        pelo menos uma liga jogável, cada um com as suas ligas, da elite para
        baixo. `availableClubCount` conta os clubes sem dono — no multiplayer,
        cada técnico escolhe um clube livre. Copas e continentais não entram:
        o clube é escolhido pela LIGA que disputa.

        Ordem: países por nome; ligas por `tier`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Países com as suas ligas
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/WorldCountry' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/clubs/available:
    get:
      tags: [Club]
      operationId: listAvailableClubs
      summary: Clubes sem dono (disponíveis para reivindicar)
      description: |
        Lista os clubes com `ownerId == null`, com metadados para o card de
        seleção (caixa, capacidade do estádio, força média do elenco).

        Com `competitionId` (issue #131), só os clubes daquela liga — o último
        passo do onboarding país → liga → clube. Uma liga inexistente devolve
        lista vazia, não 404: o filtro é de consulta, não um recurso.
        Ordem: força média decrescente, depois nome.
      security:
        - bearerAuth: []
      parameters:
        - name: competitionId
          in: query
          required: false
          description: Id da liga (`bra-serie-a`, `eng-premier-league`); omitido = todas
          schema: { type: string, pattern: '^[a-z0-9][a-z0-9-]*$' }
      responses:
        '200':
          description: Clubes disponíveis
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AvailableClub' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/clubs/{id}/claim:
    post:
      tags: [Club]
      operationId: claimClub
      summary: Reivindicar um clube para o usuário autenticado
      description: |
        Marca o clube como pertencente ao usuário autenticado e grava o
        `clubId` no usuário. Transacional com lock otimista: se dois usuários
        tentarem reivindicar o mesmo clube simultaneamente, o segundo recebe
        `409 CLUB_ALREADY_CLAIMED`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ClubIdPath'
      responses:
        '200':
          description: Clube reivindicado — devolve o usuário atualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthUser' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Clube já reivindicado (`CLUB_ALREADY_CLAIMED`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/clubs/{id}:
    get:
      tags: [Club]
      operationId: getClub
      summary: Estado completo do clube
      description: Retorna clube com elenco, caixa, estádio e escalação atual.
      parameters:
        - $ref: '#/components/parameters/ClubIdPath'
      responses:
        '200':
          description: Clube encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Club' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/clubs/{id}/lineup:
    post:
      tags: [Club]
      operationId: saveLineup
      summary: Salvar escalação, formação e postura
      description: |
        Define os 11 titulares, a formação e a postura da partida. A ordem do
        array `playerIds` deve corresponder aos slots da formação escolhida
        (ver `Formation`).

        A postura (issue #56) é gravada JUNTO da escalação, numa única
        operação — a engine da rodada lê as duas do mesmo estado persistido.
        Omitir `posture` mantém `BALANCED`.
      parameters:
        - $ref: '#/components/parameters/ClubIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LineupRequest' }
      responses:
        '204':
          description: Escalação salva
        '400':
          description: |
            Escalação inválida. `code` do `ErrorResponse`:
            - `INCOMPLETE_LINEUP` — não vieram exatamente 11 `playerIds`;
            - `DUPLICATE_PLAYERS` — algum ID aparece mais de uma vez (issue #80);
              `details.playerIds` traz os IDs repetidos em CSV (ex.: `"1,7"`);
            - `INVALID_LINEUP` — jogador fora do elenco do clube;
            - `INJURED_PLAYERS` — jogador lesionado (issue #54);
              `details.playerIds` traz os IDs lesionados em CSV;
            - `TOO_MANY_FOREIGN_PLAYERS` — mais estrangeiros que
              `Club.foreignPlayerLimit` (issue #130); `details.limit` traz o
              limite e `details.playerIds` os estrangeiros escalados, em CSV.
              Suspenso NÃO é recusado: a suspensão é por competição e o apito
              inicial o deixa fora só dos jogos dela.
            Além dos genéricos `MALFORMED_REQUEST` (ex.: formação desconhecida)
            e `INVALID_PARAMETER` — ver `components.responses.BadRequest`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ClubWriteConflict'

  /api/clubs/{id}/stadium/expand:
    post:
      tags: [Stadium]
      operationId: expandStadium
      summary: Ampliar capacidade do estádio
      description: |
        Investe caixa do clube para aumentar a capacidade do estádio, a
        US$ 20 (`2000` centavos de USD) por assento. Pedidos abaixo de 1000 assentos
        (incluindo zero e negativos) falham com 400 `INVALID_STADIUM_EXPANSION`
        sem alterar caixa nem capacidade (issue #79). Falha com
        `INSUFFICIENT_FUNDS` se o caixa for insuficiente.
      parameters:
        - $ref: '#/components/parameters/ClubIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpandStadiumRequest' }
      responses:
        '200':
          description: Estádio ampliado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Club' }
        '400':
          description: |
            Ampliação abaixo do mínimo de assentos (`INVALID_STADIUM_EXPANSION`),
            além dos genéricos `MALFORMED_REQUEST`/`INVALID_PARAMETER`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '402':
          description: Caixa insuficiente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Usuário não é dono do clube
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ClubWriteConflict'

  /api/clubs/{id}/medical:
    post:
      tags: [Medical]
      operationId: treatSquad
      summary: Sessão do departamento médico
      description: |
        Paga a taxa fixa de US$ 6.000 (`600000` centavos de USD) e acelera a
        recuperação do elenco (issue #54): todo jogador ganha +30 de stamina
        (teto 100) e as lesões em curso encurtam uma rodada. Falha com
        `INSUFFICIENT_FUNDS` se o caixa não cobrir a taxa.
      parameters:
        - $ref: '#/components/parameters/ClubIdPath'
      responses:
        '200':
          description: Elenco tratado — devolve o clube já atualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Club' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          description: Caixa insuficiente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Usuário não é dono do clube
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ClubWriteConflict'

  /api/clubs/{id}/training:
    post:
      tags: [Training]
      operationId: setTrainingFocus
      summary: Escolher o foco de treino da semana
      description: |
        Registra o foco de treino do clube (issue #58). O efeito não acontece
        aqui: ele entra na virada da rodada, junto do desgaste físico — e
        exatamente uma vez, sob o mesmo claim que protege os demais efeitos.
        Quem nunca escolheu (e todo clube da IA) treina em `DESCANSO`.
      parameters:
        - $ref: '#/components/parameters/ClubIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TrainingFocusRequest' }
      responses:
        '200':
          description: Foco registrado — devolve o clube já atualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Club' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: Usuário não é dono do clube
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          $ref: '#/components/responses/NotFound'

  /api/clubs/{id}/ticket-price:
    put:
      tags: [Stadium]
      operationId: setTicketPrice
      summary: Definir o preço do ingresso do estádio
      description: |
        Define quanto o clube cobra por ingresso (issue #59). `PUT`, e não
        `POST` como os comandos vizinhos, porque é a substituição idempotente
        de um ajuste do clube, não uma ação com efeito acumulado.

        O preço alimenta a curva de demanda da bilheteria: acima do "preço
        justo" do time o estádio esvazia progressivamente, abaixo dele a
        ocupação se aproxima do teto de 100%. Como a ocupação satura, a receita
        tem um máximo em preço intermediário — e o preço justo sobe com a força
        do elenco, então time melhor suporta ingresso mais caro.

        Fora da faixa `2_00..40_00` (centavos de USD) o comando falha com
        `TICKET_PRICE_OUT_OF_RANGE`. Quem nunca mexeu — e todo clube da IA —
        cobra US$ 10 (`1000`).
      parameters:
        - $ref: '#/components/parameters/ClubIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TicketPriceRequest' }
      responses:
        '200':
          description: Preço registrado — devolve o clube já atualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Club' }
        '400':
          description: |
            Preço fora da faixa permitida, além dos genéricos
            `MALFORMED_REQUEST`/`INVALID_PARAMETER`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Usuário não é dono do clube
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          $ref: '#/components/responses/NotFound'

  /api/clubs/{id}/board:
    get:
      tags: [Board]
      operationId: getBoardStatus
      summary: Painel da diretoria — meta da temporada e confiança no técnico
      description: |
        Meta que a diretoria fixou para a temporada corrente (issue #62) e
        onde o clube está agora. A meta é proporcional à força do elenco contra
        os da mesma divisão: elenco entre os favoritos ⇒ título; metade de cima
        ⇒ metade de cima da tabela; o resto ⇒ meio de tabela.

        A confiança (0..100) anda a cada rodada de LIGA conforme a posição × a
        meta. Ao fim da temporada: meta cumprida rende `bonusCents` em caixa;
        meta perdida com a confiança em `firingConfidence` ou abaixo demite o
        técnico — o veredito viaja no `SeasonFinished` (`boardReviews`).

        `mood` e `firingConfidence` vêm prontos do backend para a UI não
        reimplementar os limiares.
      parameters:
        - $ref: '#/components/parameters/ClubIdPath'
      responses:
        '200':
          description: Painel da diretoria do clube
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BoardStatus' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Clube inexistente ou fora de qualquer tabela (`BOARD_NOT_FOUND`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/market:
    get:
      tags: [Market]
      operationId: listMarket
      summary: Buscar no pool de jogadores livres
      description: |
        O pool de livres do mundo (issue #139): quem teve o contrato vencido,
        quem a IA dispensou, quem foi vendido na venda rápida e o mercado
        inicial. Filtros, ordenação e paginação são do servidor — o pool tem
        centenas de jogadores. Parâmetro inválido é 400 `INVALID_MARKET_QUERY`.
      parameters:
        - name: position
          in: query
          required: false
          description: Filtra por posição
          schema: { $ref: '#/components/schemas/Position' }
        - name: nationality
          in: query
          required: false
          description: Código FIFA da nacionalidade (ex. `BRA`)
          schema: { type: string, pattern: '^[A-Z]{3}$', example: BRA }
        - name: minAge
          in: query
          required: false
          schema: { type: integer, minimum: 15, maximum: 50 }
        - name: maxAge
          in: query
          required: false
          schema: { type: integer, minimum: 15, maximum: 50 }
        - name: minValue
          in: query
          required: false
          description: Valor de mercado mínimo (centavos de USD)
          schema: { type: integer, format: int64, minimum: 0 }
        - name: maxValue
          in: query
          required: false
          description: Valor de mercado máximo (centavos de USD)
          schema: { type: integer, format: int64, minimum: 0 }
        - name: maxPrice
          in: query
          required: false
          description: Taxa de compra máxima (centavos de USD)
          schema: { type: integer, format: int64, minimum: 0 }
        - name: q
          in: query
          required: false
          description: Trecho do nome, sem diferenciar maiúsculas nem acentos
          schema: { type: string }
        - name: sort
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/MarketSort'
        - name: dir
          in: query
          required: false
          schema: { type: string, enum: [asc, desc], default: asc }
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
        - name: size
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Uma página do pool, já filtrada e ordenada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketPage' }
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/market/buy:
    post:
      tags: [Market]
      operationId: buyPlayer
      summary: Contratar jogador do mercado
      description: |
        Devolve um `TransferResult` como union — `Success` traz o clube
        atualizado e o jogador contratado; variantes de erro indicam o motivo.
        Só dentro da janela de transferência do clube comprador
        (`TransferWindowClosed` fora dela) e respeitando o limite de registros
        do jogador (`TransferLimitReached`) — issue #137.

        O livre só assina se aceitar os termos pessoais de `contract` (issue
        #138): recusando, volta `PlayerRefused` com o motivo e o que ele pede,
        e nada muda (caixa, elenco e mercado). Termos malformados (salário
        negativo, cláusula não positiva) são 400 `INVALID_CONTRACT_OFFER`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BuyPlayerRequest' }
      responses:
        '200':
          description: Resultado da operação (sucesso ou erro de negócio)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferResult' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/market/sell:
    post:
      tags: [Market]
      operationId: sellPlayer
      summary: Vender jogador do elenco
      description: |
        O clube recebe 60% do valor de mercado do jogador NO CLUBE (issue #135:
        overall, idade, contrato e força da liga), e ele vai ao mercado
        anunciado por 125% do valor de referência do mercado
        (`domain/rules/TransferRules`). O pagamento é sempre menor que o
        anúncio, de qualquer liga: comprar e revender o mesmo jogador dá
        prejuízo, nunca lucro. Só dentro da janela de transferência do clube
        vendedor (`TransferWindowClosed` fora dela, issue #137).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SellPlayerRequest' }
      responses:
        '200':
          description: Resultado da operação
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferResult' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/clubs/{id}/offers:
    get:
      tags: [Offers]
      operationId: listClubOffers
      summary: Propostas recebidas e enviadas pelo clube
      description: |
        Propostas em que o clube é comprador OU vendedor (issue #63): TODAS as
        pendentes, seguidas das 50 resolvidas mais recentes — cada grupo da mais
        nova para a mais antiga. A UI separa recebidas
        (`sellerClubId` = o clube) de enviadas e consulta este endpoint com
        polling para avisar o técnico de proposta nova. Só o dono do clube lê.
      parameters:
        - $ref: '#/components/parameters/ClubIdPath'
      responses:
        '200':
          description: Propostas do clube
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TransferOffer' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: O usuário não é dono do clube (`FORBIDDEN`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          $ref: '#/components/responses/NotFound'

  /api/offers:
    post:
      tags: [Offers]
      operationId: createOffer
      summary: Fazer proposta por um jogador de outro técnico
      description: |
        Proposta em dinheiro por um jogador do elenco de outro clube com dono
        humano (issue #63). Nada muda de mãos aqui: a proposta fica pendente
        por `slotsLeft` encaixes jogados, até o vendedor aceitar ou recusar, o
        comprador retirar ou o prazo vencer.

        As mesmas regras do aceite já valem na criação — valor mínimo, caixa do
        comprador, elenco cheio, vendedor humano e elenco mínimo do vendedor
        (11 jogadores, sem vender o último goleiro) — e voltam como variantes de
        `TransferOfferResult` no 200. Uma proposta pendente por comprador ×
        jogador: a segunda volta `OfferAlreadyPending` (retire a antiga para
        mudar o valor).

        Termos pessoais (issue #138): o jogador responde aos termos de
        `contract` já na criação — recusando, volta `PlayerRefused` e a
        proposta nem nasce. Aceitando, os termos ficam na proposta e o aceite
        do vendedor assina exatamente esse contrato. Termos malformados são
        400 `INVALID_CONTRACT_OFFER`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOfferRequest' }
      responses:
        '200':
          description: Resultado (proposta criada ou erro de negócio)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferOfferResult' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: O usuário não é dono do clube comprador (`FORBIDDEN`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          $ref: '#/components/responses/NotFound'

  /api/offers/{id}/accept:
    post:
      tags: [Offers]
      operationId: acceptOffer
      summary: Aceitar proposta (vendedor)
      description: |
        Executa a transferência atomicamente (issue #63): debita o comprador,
        credita o vendedor, move o jogador e expira as outras propostas
        pendentes pelo mesmo jogador (`OfferExpired` com
        `PLAYER_TRANSFERRED`) — tudo ou nada. As regras são revalidadas aqui,
        porque o caixa e os elencos podem ter mudado desde a proposta.

        Dois aceites simultâneos pelo mesmo jogador: exatamente um vence; o
        outro recebe `OfferExpired`. Bloqueado durante a simulação da rodada
        (`RoundInProgress`). Se o jogador já saiu do elenco do vendedor, a
        proposta expira na hora (`OfferExpired` com `PLAYER_TRANSFERRED`).
      parameters:
        - $ref: '#/components/parameters/OfferIdPath'
      responses:
        '200':
          description: Resultado (transferência feita ou erro de negócio)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferOfferResult' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: O usuário não é dono do clube vendedor (`FORBIDDEN`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Proposta (`OFFER_NOT_FOUND`) ou clube inexistente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/offers/{id}/reject:
    post:
      tags: [Offers]
      operationId: rejectOffer
      summary: Recusar proposta (vendedor)
      parameters:
        - $ref: '#/components/parameters/OfferIdPath'
      responses:
        '200':
          description: Resultado (proposta recusada ou erro de negócio)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferOfferResult' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: O usuário não é dono do clube vendedor (`FORBIDDEN`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Proposta (`OFFER_NOT_FOUND`) ou clube inexistente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/offers/{id}/withdraw:
    post:
      tags: [Offers]
      operationId: withdrawOffer
      summary: Retirar proposta (comprador)
      parameters:
        - $ref: '#/components/parameters/OfferIdPath'
      responses:
        '200':
          description: Resultado (proposta retirada ou erro de negócio)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferOfferResult' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: O usuário não é dono do clube comprador (`FORBIDDEN`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Proposta (`OFFER_NOT_FOUND`) ou clube inexistente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/league/standings:
    get:
      tags: [League]
      operationId: getStandings
      summary: Tabelas de classificação (uma por liga do mundo)
      description: |
        Sem `season`, retorna a tabela corrente de cada liga do mundo (issue
        #131) — cada liga está na sua própria temporada (a europeia de 2026/27
        convive com a brasileira de 2027). Com `season`, as tabelas finais das
        ligas cuja temporada COMEÇOU naquele ano (histórico).
        Ordem: país do mundo (Brasil primeiro), depois `division` (elite primeiro).
      parameters:
        - name: season
          in: query
          required: false
          description: Ano da temporada (omitido = temporada ativa)
          schema: { type: integer }
      responses:
        '200':
          description: |
            Tabelas por divisão; cada uma ordenada por pontos, saldo, gols pró
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Standings' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Temporada inexistente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/league/history:
    get:
      tags: [League]
      operationId: getSeasonHistory
      summary: Temporadas encerradas (histórico da liga)
      description: |
        Snapshot de cada temporada já encerrada de cada país (issue #131) —
        campeão, artilheiro e classificação final de todas as divisões do
        país —, da mais recente para a mais antiga; na mesma temporada, o
        Brasil primeiro e os demais pelo código do país. Os records são gravados na virada de temporada, ANTES
        de a tabela e as estatísticas dos jogadores serem zeradas, e nunca
        são reescritos.

        Lista vazia enquanto a primeira temporada não terminou: liga nova
        sem história é estado normal, não erro.
      responses:
        '200':
          description: Temporadas encerradas, da mais recente para a mais antiga
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SeasonRecord' }

  /api/league/history/{season}:
    get:
      tags: [League]
      operationId: getSeasonRecord
      summary: Uma temporada do histórico
      description: |
        Cada país vira no seu tempo (issue #131), então o histórico é por
        temporada + país: o Brasil de 2026 e a Europa de 2026/27 são dois
        records de `season = 2026`. Sem `country`, devolve o primeiro
        encerrado naquele ano na ordem de `/history` (o Brasil, quando ele já
        virou).
      parameters:
        - name: season
          in: path
          required: true
          description: Ano (de início) da temporada encerrada
          schema: { type: integer }
        - name: country
          in: query
          required: false
          description: Código do país (`BRA`, `ENG`…) — issue #131
          schema: { type: string, example: BRA }
      responses:
        '200':
          description: Snapshot da temporada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeasonRecord' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Temporada não encerrada (ou inexistente)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/league/history/club/{clubId}:
    get:
      tags: [League]
      operationId: getClubCareer
      summary: Perfil do técnico — carreira do clube
      description: |
        Projeção do histórico para um clube: temporadas disputadas, em quais
        foi campeão e qual foi a melhor campanha. Derivada dos `SeasonRecord`
        no backend, para o cliente não reimplementar o critério de "melhor
        campanha" (divisão pesa mais que posição).
      parameters:
        - name: clubId
          in: path
          required: true
          description: ID do clube
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Carreira do clube
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClubCareer' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Clube sem nenhuma temporada encerrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/league/cup:
    get:
      tags: [Cup]
      operationId: getCup
      summary: Chave da copa mata-mata (issues #61 e #131)
      description: |
        Copa nacional (a Copa do Brasil no MVP) em fases nomeadas, cada uma em
        jogo único ou ida e volta, com clubes entrando em fases diferentes
        (os mais fortes nas mais tardias). Sorteada no início de cada temporada
        com seed determinística; cada fase seguinte é sorteada quando a anterior
        termina. Sem `season`, devolve a copa da temporada mais recente (a que
        está em disputa). Os confrontos já trazem quem passou (`winnerId`,
        agregado e pênaltis incluídos) — o cliente não recalcula nada.

        404 `CUP_NOT_FOUND` quando a temporada não teve copa.
      parameters:
        - name: season
          in: query
          required: false
          description: Ano da temporada (omitido = temporada mais recente)
          schema: { type: integer }
      responses:
        '200':
          description: Chave da copa
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cup' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Temporada sem copa
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/league/calendar:
    get:
      tags: [League]
      operationId: getCalendar
      summary: Data corrente do jogo e próximo jogo do clube
      description: |
        Relógio do jogo (issue #125): o encaixe corrente (semana ISO + meio ou
        fim de semana) e, com `clubId`, o próximo jogo do clube e a competição
        dele. Encaixes em que o clube não joga (copa de quem já caiu, por
        exemplo) são pulados. Sem calendário, os campos vêm ausentes.
      parameters:
        - name: clubId
          in: query
          required: false
          schema: { type: integer, format: int64 }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Calendar' }

  /api/league/round/current:
    get:
      tags: [League]
      operationId: getCurrentRound
      summary: Jogos do encaixe corrente
      description: |
        Retorna os jogos do ENCAIXE corrente do calendário semanal (issue
        #125): todas as partidas de todas as competições marcadas para aquela
        quarta ou domingo. Cada partida tem seu próprio `matchId` e diz o que
        disputa (`stage`) e de qual competição. Para acompanhar ao vivo,
        conecte-se em `/ws/slot/{key}` (com a `matchday.key`) após chamar
        `playRound`.

        Semanas sem jogo nenhum não existem para o relógio: o encaixe seguinte
        ao jogado é o próximo COM jogo.
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Round' }

  /api/league/round/readiness:
    get:
      tags: [League]
      operationId: getRoundReadiness
      summary: Prontidão da rodada (lobby)
      description: |
        Estado de "todos prontos → joga rodada" da liga compartilhada
        (issue #20). Alimenta o card de lobby; o cliente refaz a busca após
        sinalizar pronto (ou recebe push via WS de lobby, opcional).
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadinessStatus' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/league/round/ready:
    post:
      tags: [League]
      operationId: markRoundReady
      summary: Sinalizar que o técnico está pronto
      description: |
        O técnico autenticado declara estar pronto para o encaixe corrente
        (issues #20 e #125). Idempotente. Devolve o estado de prontidão atualizado.
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadinessStatus' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/league/round/play:
    post:
      tags: [League]
      operationId: playRound
      summary: Iniciar simulação da rodada
      description: |
        Marca o encaixe corrente como `InProgress` e devolve a chave dele
        (`matchday`) para o cliente conectar em `/ws/slot/{key}`. Em liga compartilhada só
        destrava quando TODOS os técnicos humanos sinalizaram prontos
        (issue #20); caso contrário retorna 409 `ROUND_NOT_READY`.
        Idempotente enquanto a rodada não termina.
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required: [matchday]
                properties:
                  matchday:
                    type: string
                    description: 'Chave do encaixe liberado (`2026-W05-WEEKEND`), issue #125'
                    example: 2026-W05-WEEKEND
        '409':
          description: |
            Rodada já encerrada (`ROUND_ALREADY_FINISHED`) ou ainda
            aguardando técnicos (`ROUND_NOT_READY` — `details` traz
            `ready`, `total` e `pending`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  # --- #132 Libertadores ---
  /api/libertadores:
    get:
      tags: [Libertadores]
      operationId: getLibertadores
      summary: Grupos e chave da Libertadores (issue #132)
      description: |
        A edição da Copa Libertadores: os 8 grupos sorteados (sem dois clubes
        do mesmo país no mesmo grupo), a tabela de cada um já ordenada pelos
        desempates da competição (os 2 primeiros com `zone: QUALIFICATION`),
        os jogos de cada grupo e, quando os grupos acabam, o mata-mata — na
        MESMA forma da chave da Copa do Brasil (`Cup`), com a final em jogo
        único na sede neutra (`finalVenue`). Sem `season`, a edição mais
        recente (a em disputa).

        Corte do MVP: os 32 entram direto nos grupos (sem fases preliminares)
        e o 3º do grupo é eliminado.

        404 `LIBERTADORES_NOT_FOUND` quando o mundo não tem Libertadores (o
        recorte do E2E, por exemplo) ou a temporada não teve.
      parameters:
        - name: season
          in: query
          required: false
          description: Ano da edição (omitido = a mais recente)
          schema: { type: integer }
      responses:
        '200':
          description: Edição da Libertadores
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Libertadores' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Mundo ou temporada sem Libertadores
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # --- #134 Seleções ---
  /api/national-teams:
    get:
      tags: [NationalTeams]
      operationId: getNationalTeams
      summary: Datas FIFA, resultados das seleções, Eliminatórias e ranking
      description: |
        Painel das seleções (issue #134). `windows` lista as datas FIFA do ano
        corrente do jogo e do seguinte, com a situação de cada uma — é o que o
        calendário usa para destacar as pausas. `nextWindow` é a janela em que
        o relógio está ou a próxima. `lastResults` são os jogos da última
        janela disputada. A classificação das Eliminatórias da CONMEBOL e o
        ranking são calculados pelo backend a partir dos placares — a UI só
        exibe.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Painel das seleções
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NationalTeamsOverview' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/clubs/{id}/call-ups:
    get:
      tags: [NationalTeams]
      operationId: getClubCallUps
      summary: Convocados do clube na data FIFA corrente ou na próxima
      description: |
        Quem do clube vai para a seleção (issue #134). Antes da janela
        (`window.status = UPCOMING`) a lista é a PRÉVIA, calculada com os
        elencos de agora — o técnico vê quem perderá. Com a janela em curso
        (`CALLED`), é a convocação de fato: esses jogadores estão com
        `availability.type = OnInternationalDuty` e ficam fora de todos os
        jogos do clube até a janela acabar. `window` ausente só num save sem
        calendário.
      parameters:
        - $ref: '#/components/parameters/ClubIdPath'
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Convocados do clube
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClubCallUps' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Clube inexistente (`CLUB_NOT_FOUND`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # --- #137 Janelas de transferência ---
  /api/clubs/{id}/transfer-window:
    get:
      tags: [Market]
      operationId: getClubTransferWindow
      summary: Janela de transferência da federação do clube hoje
      description: |
        O selo "Janela aberta até …" / "Abre em …" do mercado e do cabeçalho
        (issue #137). A janela que vale é a da federação (país) do clube, na
        data do relógio do jogo (o encaixe corrente). Compra, venda ao mercado,
        criação e aceite de proposta fora dela devolvem `TransferWindowClosed`.
      parameters:
        - $ref: '#/components/parameters/ClubIdPath'
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Situação da janela
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferWindowStatus' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Clube inexistente (`CLUB_NOT_FOUND`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  # --- fim #137 ---

  # --- #138 Termos pessoais e renovação ---
  /api/clubs/{id}/players/{playerId}/renewal:
    post:
      tags: [Market]
      operationId: renewContract
      summary: Oferecer renovação a um jogador do próprio elenco
      description: |
        O jogador aceita ou recusa os termos por regra determinística (issue
        #138): a mesma oferta no mesmo estado dá sempre a mesma resposta.
        Aceitando (`Renewed`), o contrato novo SUBSTITUI o antigo e a duração
        recomeça na data do jogo. Na renovação ele não aceita ganhar menos do
        que já ganha. Recusando (`PlayerRefused`), diz o motivo e o salário que
        aceitaria; uma oferta abaixo de 75% do pedido e abaixo do salário atual
        é ofensiva e esfria a conversa por 4 semanas do jogo (`cooldownUntil`) — até lá, nova
        proposta volta `TalksCoolingDown`. Não depende de janela de
        transferência. Só o dono do clube renova.
      parameters:
        - $ref: '#/components/parameters/ClubIdPath'
        - name: playerId
          in: path
          required: true
          description: ID do jogador do elenco
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContractOffer' }
      responses:
        '200':
          description: Resultado (renovado ou erro de negócio)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RenewalResult' }
        '400':
          description: Corpo malformado ou termos inválidos (`INVALID_CONTRACT_OFFER`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: O usuário não é dono do clube (`FORBIDDEN`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Clube inexistente (`CLUB_NOT_FOUND`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  # --- fim #138 ---

  # --- #133 Navegação do mundo ---
  /api/competitions:
    get:
      tags: [World]
      operationId: listCompetitions
      summary: Competições do mundo do save (issue #133)
      description: |
        Todas as competições do catálogo do save — ligas, copas nacionais e,
        quando existirem, continentais —, cada uma na SUA temporada corrente.
        A UI agrupa por país (`country`; continentais vêm sem país, com a
        `confederation` dona).

        Ordem: Brasil primeiro, depois os demais países pelo código; dentro do
        país, as ligas da elite para baixo e depois as copas; continentais por
        último.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Competições do mundo
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CompetitionSummary' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/competitions/{competitionId}:
    get:
      tags: [World]
      operationId: getCompetition
      summary: Uma competição, com formato e critérios de desempate (issue #133)
      description: |
        O `format` diz quais visões a competição tem (tabela, chave, grupos):
        a UI faz `switch` exaustivo sobre ele. `tiebreakers` é a ordem dos
        critérios que o backend aplica na tabela — a UI só os lista.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CompetitionIdPath'
      responses:
        '200':
          description: Competição
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompetitionDetail' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Competição fora do catálogo do save (`COMPETITION_NOT_FOUND`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/competitions/{competitionId}/standings:
    get:
      tags: [World]
      operationId: getCompetitionStandings
      summary: Tabela corrente de uma liga (issue #133)
      description: |
        A tabela da temporada corrente da competição, já ordenada pelos
        desempates dela e com a faixa (`zone`) de cada posição — o mesmo
        `Standings` de `/api/league/standings`. Competição sem tabela
        (mata-mata) ou ainda sem temporada: 404 `STANDINGS_NOT_FOUND`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CompetitionIdPath'
      responses:
        '200':
          description: Tabela da competição
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Standings' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Competição desconhecida (`COMPETITION_NOT_FOUND`) ou sem tabela (`STANDINGS_NOT_FOUND`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/competitions/{competitionId}/matches:
    get:
      tags: [World]
      operationId: listCompetitionMatches
      summary: Jogos da temporada corrente, por encaixe (issue #133)
      description: |
        Os encaixes da temporada corrente da competição, em ordem, cada um
        com os jogos DELA. Encaixes já jogados trazem os placares gravados;
        os futuros vêm do calendário do backend. Num mata-mata só a fase em
        disputa tem confrontos conhecidos: encaixe de fase ainda não
        sorteada vem com `matches` vazio.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CompetitionIdPath'
      responses:
        '200':
          description: Encaixes da competição
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CompetitionMatchday' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Competição desconhecida (`COMPETITION_NOT_FOUND`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/competitions/{competitionId}/scorers:
    get:
      tags: [World]
      operationId: listCompetitionScorers
      summary: Artilharia dos clubes da competição (issue #133)
      description: |
        Os artilheiros dos clubes que disputam a competição, do que mais
        marcou para o que menos (empate pelo nome), até 20, só quem marcou.

        **Corte do MVP:** os gols são os da TEMPORADA do jogador em todas as
        competições — o jogo ainda não separa gols por competição.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CompetitionIdPath'
      responses:
        '200':
          description: Artilheiros
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CompetitionScorer' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Competição desconhecida (`COMPETITION_NOT_FOUND`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/competitions/{competitionId}/bracket:
    get:
      tags: [World]
      operationId: getCompetitionBracket
      summary: Chave de mata-mata da competição (issue #133)
      description: |
        A chave da temporada corrente de uma copa — o mesmo `Cup` de
        `/api/league/cup`, mas da competição pedida. Competição sem chave
        (liga de pontos corridos) ou copa ainda não sorteada: 404
        `BRACKET_NOT_FOUND`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CompetitionIdPath'
      responses:
        '200':
          description: Chave da copa
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cup' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Competição desconhecida (`COMPETITION_NOT_FOUND`) ou sem chave (`BRACKET_NOT_FOUND`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/clubs/{id}/schedule:
    get:
      tags: [World]
      operationId: getClubSchedule
      summary: Calendário do clube semana a semana (issue #133)
      description: |
        As próximas `weeks` semanas a partir da semana do encaixe corrente,
        cada uma com os jogos do clube (e a competição de cada um) e se é
        data FIFA. Jogos já disputados na semana corrente vêm com o placar.
        Semanas além da temporada corrente de cada competição vêm vazias —
        a edição seguinte só é agendada na virada. Sem calendário, `weeks`
        vem vazio e `current` ausente.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ClubIdPath'
        - name: weeks
          in: query
          required: false
          description: Quantas semanas (padrão 8, de 1 a 26)
          schema: { type: integer, minimum: 1, maximum: 26, default: 8 }
      responses:
        '200':
          description: Calendário do clube
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClubSchedule' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Clube inexistente (`CLUB_NOT_FOUND`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  # --- fim #133 ---

  /ws/slot/{key}:
    get:
      tags: [League]
      operationId: streamRound
      summary: '[WebSocket] Stream de eventos do encaixe'
      # O JWT vai no query param `token` (ver parâmetro abaixo), não no header.
      security: []
      description: |
        **ATENÇÃO: endpoint WebSocket.** Multiplexa eventos de TODAS as
        partidas do encaixe (issue #125; antes `/ws/round/{number}`), de todas
        as competições, em um único canal. Cada mensagem é um
        `RoundEvent` (`MatchUpdate` carregando um `MatchEvent` + matchId,
        ou `RoundFinished` no encerramento com a tabela atualizada).

        Esta escolha de design (um WS por rodada em vez de N WS por
        partida) facilita a coordenação no backend Kotlin: um único
        `Flow<RoundEvent>` orquestra todas as simulações em paralelo.

        **Velocidade e "pular para o fim" (issue #115).** O stream é gerado
        POR CONEXÃO e é determinístico (cada partida usa o `matchId` como
        seed), então a velocidade (`speed`) é escolha de cada cliente e não
        afeta os outros técnicos. Não há mensagem cliente → servidor: para
        "pular para o fim", o cliente abre uma NOVA conexão com
        `speed=INSTANT`, reprocessa o stream desde o início (mesmos eventos)
        e só então fecha a conexão antiga. A ordem importa: quem chega ao fim
        primeiro encerra a rodada e recebe o `RoundFinished` completo
        (`finances`, `training`, `SeasonFinished`); um stream que chega depois
        recebe só o replay (`RoundFinished` com a tabela). Fechar a conexão
        antiga antes faria o stream órfão (que segue sem pacing no servidor)
        vencer essa corrida.

        **Prontidão (issue #151).** O servidor só simula encaixe já liberado
        por `POST /api/league/round/play` (status `InProgress`, com todos os
        técnicos prontos ou o timeout vencido). Se o encaixe ainda está
        `Scheduled`, a conexão recebe UMA única mensagem `RoundNotStarted` e
        é fechada com close code `1000` e motivo `Encaixe nao liberado` —
        nada é simulado nem gravado. O cliente volta a aguardar a prontidão.
        Encaixe `Finished` segue devolvendo o replay (`MatchUpdate`… e
        `RoundFinished` só com a tabela), sem reaplicar efeitos.
      parameters:
        - name: key
          in: path
          required: true
          description: Chave do encaixe (`Matchday.key`), ex. `2026-W05-WEEKEND`
          schema: { type: string, pattern: '^\d{4}-W\d{2}-(MIDWEEK|WEEKEND)$' }
        - name: token
          in: query
          required: true
          description: |
            JWT de autenticação (issue #27). O browser não envia o header
            `Authorization` no handshake de WebSocket, então o token viaja aqui.
            Handshake sem token válido é rejeitado com 401.
          schema: { type: string }
        - $ref: '#/components/parameters/StreamSpeedQuery'
      responses:
        '101':
          description: Switching Protocols — WebSocket estabelecido
        '200':
          description: |
            Não é uma resposta real; documentado para que o cliente
            tenha o tipo `RoundEvent` gerado pelo `openapi-typescript`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoundEvent' }
      x-websocket:
        protocol: ws
        messages:
          serverToClient:
            schema: { $ref: '#/components/schemas/RoundEvent' }

  /ws/matches/{id}:
    get:
      tags: [Match]
      operationId: streamMatch
      summary: '[WebSocket] Stream de eventos da partida ao vivo'
      # O JWT vai no query param `token` (ver parâmetro abaixo), não no header.
      security: []
      description: |
        **ATENÇÃO: endpoint WebSocket**, não HTTP. OpenAPI 3.1 não modela WS
        oficialmente, então documentamos aqui apenas o formato das mensagens
        para que o frontend tenha tipos gerados e o backend tenha referência.

        - **URL real:** `ws://host:8080/ws/matches/{id}`
        - **Direção:** servidor → cliente (read-only)
        - **Formato:** uma mensagem JSON por evento, com o schema `MatchEvent`
        - **Encerramento:** servidor fecha após enviar `FullTime`
        - **Partida de encaixe não liberado (issue #151):** enquanto o encaixe
          da partida está `Scheduled` (antes do `POST /api/league/round/play`
          liberar), nada é simulado: a conexão fecha sem mensagens, com close
          code `4409` e motivo `Encaixe nao liberado`. O stream é determinístico
          (seed = `matchId`), então transmiti-lo antes seria uma prévia do
          resultado. Encaixe `InProgress` ou `Finished` transmite normalmente;
          `Finished` é uma re-simulação com os elencos atuais.
        - **Localização:** a partida é buscada no encaixe DELA (o `matchId` é
          `serial do encaixe × 1000 + n`), não no encaixe corrente — o
          drill-down de um jogo recém-encerrado continua disponível.
      parameters:
        - name: id
          in: path
          required: true
          description: ID da partida (`serial do encaixe × 1000 + n`)
          schema: { type: integer, format: int64 }
        - name: token
          in: query
          required: true
          description: |
            JWT de autenticação (issue #27). O browser não envia o header
            `Authorization` no handshake de WebSocket, então o token viaja aqui.
            Handshake sem token válido é rejeitado com 401.
          schema: { type: string }
        - $ref: '#/components/parameters/StreamSpeedQuery'
      responses:
        '101':
          description: Switching Protocols — conexão WebSocket estabelecida
        '200':
          description: |
            Não é uma resposta real; documentado apenas para que
            `openapi-typescript` gere o tipo `MatchEvent` consumido no cliente.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MatchEvent' }
      x-websocket:
        protocol: ws
        messages:
          serverToClient:
            schema: { $ref: '#/components/schemas/MatchEvent' }

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT emitido por `/api/auth/register` ou `/api/auth/login`. Enviado em
        `Authorization: Bearer <token>`. Todos os `/api/**` exigem o token,
        exceto `/api/auth/register` e `/api/auth/login`.

  parameters:
    StreamSpeedQuery:
      name: speed
      in: query
      required: false
      description: |
        Ritmo da transmissão do WebSocket (issue #115) — ver `StreamSpeed`.
        Ausente ou com valor desconhecido → `NORMAL` (o handshake nunca é
        recusado por causa da velocidade).
      schema: { $ref: '#/components/schemas/StreamSpeed' }
    ClubIdPath:
      name: id
      in: path
      required: true
      description: ID do clube
      schema: { type: integer, format: int64 }
    # --- #133 Navegação do mundo ---
    CompetitionIdPath:
      name: competitionId
      in: path
      required: true
      description: Id da competição no catálogo do save (`bra-serie-a`, `bra-copa-do-brasil`)
      schema: { type: string, pattern: '^[a-z0-9][a-z0-9-]*$' }
    OfferIdPath:
      name: id
      in: path
      required: true
      description: ID da proposta
      schema: { type: integer, format: int64 }

  responses:
    NotFound:
      description: Recurso não encontrado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    BadRequest:
      description: |
        Entrada inválida — códigos genéricos do `ErrorResponse` (issue #81):
        `MALFORMED_REQUEST` (corpo que não desserializa; `details.reason`) ou
        `INVALID_PARAMETER` (parâmetro de path/query inválido;
        `details.parameter` e `details.value`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ValidationError:
      description: Payload inválido
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Token ausente ou inválido
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ClubWriteConflict:
      description: |
        Lock otimista do clube (issue #89): outra operação alterou o clube
        entre a leitura e a gravação — tipicamente a virada da rodada
        creditando bilheteria ou outra aba do mesmo técnico — e NADA foi
        aplicado. `code` = `CLUB_WRITE_CONFLICT`. O cliente recarrega o clube
        e o técnico decide de novo. A escalação relê e reaplica sozinha (com
        backoff) antes de chegar aqui; os comandos de efeito acumulado sobre o
        caixa (ampliar estádio, departamento médico) devolvem o conflito
        direto. Foco de treino e preço do ingresso nunca conflitam: são UPDATEs
        atômicos de uma coluna.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:

    # ─── Auth ──────────────────────────────────────────────────────────────
    RegisterRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 30
        password:
          type: string
          minLength: 6
          maxLength: 100

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }

    AuthUser:
      type: object
      required: [id, username]
      properties:
        id:       { type: integer, format: int64 }
        username: { type: string }
        clubId:
          type: integer
          format: int64
          nullable: true
          description: Clube reivindicado pelo usuário; `null` antes da seleção.
        dismissal:
          oneOf:
            - $ref: '#/components/schemas/Dismissal'
            - type: 'null'
          description: |
            Demissão mais recente (issue #62). Presente (com `clubId` nulo), a
            UI mostra a tela de game over; volta a `null` quando o técnico
            reivindica um clube novo. `null` (ou omitido) para quem nunca foi
            demitido.

    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
          description: 'JWT para o header Authorization: Bearer <token>.'
        user: { $ref: '#/components/schemas/AuthUser' }

    AvailableClub:
      description: Resumo de um clube sem dono, para o card de seleção.
      type: object
      required: [id, name, cash, stadiumCapacity, averageOverall, division, country, competitionId, competitionName]
      properties:
        country:         { $ref: '#/components/schemas/Country' }
        competitionId:
          type: string
          description: Liga que o clube disputa na temporada (issue #131)
          example: bra-serie-a
        competitionName: { type: string, example: Campeonato Brasileiro Série A }
        id:              { type: integer, format: int64 }
        name:            { type: string }
        cash:            { type: integer, format: int64, description: Caixa em centavos de USD }
        stadiumCapacity: { type: integer, minimum: 0 }
        averageOverall:
          type: integer
          minimum: 0
          maximum: 99
          description: Força média do elenco (média dos `overall`).
        division:
          type: integer
          minimum: 1
          description: 'Divisão em que o clube disputa a temporada (1 = elite)'

    WorldCountry:
      description: Um país do onboarding com as suas ligas jogáveis (issue #131).
      type: object
      required: [country, leagues]
      properties:
        country: { $ref: '#/components/schemas/Country' }
        leagues:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/WorldLeague' }

    WorldLeague:
      description: Uma liga de pontos corridos do mundo, para o onboarding (issue #131).
      type: object
      required: [id, name, tier, clubCount, availableClubCount, seasonLabel]
      properties:
        id:   { type: string, example: bra-serie-a }
        name: { type: string, example: Campeonato Brasileiro Série A }
        tier:
          type: integer
          minimum: 1
          description: Divisão no país (1 = elite)
        clubCount:          { type: integer, minimum: 0 }
        availableClubCount: { type: integer, minimum: 0, description: Clubes sem dono }
        seasonLabel:
          type: string
          description: Temporada corrente da liga — `2026` no Brasil, `2026/27` na Europa
          example: '2026'

    # ─── Enums ─────────────────────────────────────────────────────────────
    Confederation:
      type: string
      description: Confederação da FIFA a que o país é filiado (issue #123)
      enum: [CONMEBOL, UEFA, CONCACAF, CAF, AFC, OFC]

    Country:
      type: object
      description: |
        País como o futebol o enxerga (issue #123): uma federação filiada a uma
        confederação. `code` é o trigrama FIFA (`BRA`, `ARG`, `ENG`, `GER`),
        não o ISO — Inglaterra, Escócia e Gales são seleções distintas.
      required: [code, name, confederation, flag]
      properties:
        code:
          type: string
          pattern: '^[A-Z]{3}$'
          example: BRA
        name:         { type: string, example: Brasil }
        confederation: { $ref: '#/components/schemas/Confederation' }
        flag:
          type: string
          description: Emoji da bandeira, montado pelo backend — a UI só exibe.
          example: 🇧🇷

    Position:
      type: string
      description: Posição do jogador no campo
      enum: [GK, CB, MF, FW]
      x-labels:
        GK: GL
        CB: ZG
        MF: MC
        FW: AT

    Formation:
      type: string
      description: |
        Esquema tático (define ordem das posições nos slots). Desde a issue #56
        a formação também pesa na simulação: 4-3-3 e 3-5-2 inclinam o time ao
        ataque, 5-3-2 à defesa e 4-4-2 é o eixo neutro. O peso é menor que o da
        `Posture` — a formação inclina, a postura decide.
      enum: ['4-4-2', '4-3-3', '3-5-2', '5-3-2']

    StreamSpeed:
      type: string
      description: |
        Velocidade da transmissão ao vivo nos WebSockets `/ws/slot/{key}`
        e `/ws/matches/{id}` (issue #115). Só muda o intervalo entre as
        mensagens — os eventos e o resultado são idênticos em qualquer
        velocidade, para o mesmo `matchId`.

        | Valor     | Pausa por minuto simulado | Rodada (90')   |
        |-----------|---------------------------|----------------|
        | `SLOW`    | 160 ms                    | ~14 s          |
        | `NORMAL`  | 80 ms                     | ~7 s           |
        | `FAST`    | 20 ms                     | ~2 s           |
        | `INSTANT` | 0 ms                      | < 1 s          |

        O ritmo é responsabilidade do adapter WebSocket, nunca do domínio.
      enum: [SLOW, NORMAL, FAST, INSTANT]
      default: NORMAL

    Posture:
      type: string
      description: |
        Postura do time na partida (issue #56) — a decisão tática por rodada,
        salva junto da escalação.

        `OFFENSIVE` aumenta a chance de gol dos DOIS times (jogo aberto);
        `DEFENSIVE` reduz as duas, cedendo menos do que deixa de criar — é o
        que torna "fechar o time" racional contra adversário mais forte.
        Os multiplicadores vivem no backend (`enum class Posture`); o cliente
        só escolhe e exibe.
      enum: [DEFENSIVE, BALANCED, OFFENSIVE]
      default: BALANCED
      x-labels:
        DEFENSIVE: Defensiva
        BALANCED: Equilibrada
        OFFENSIVE: Ofensiva

    TrainingFocus:
      type: string
      description: |
        Foco do treino da semana (issue #58) — a decisão de gestão ENTRE
        rodadas, diferente da `Posture`, que é a decisão da partida.

        `ATAQUE`/`DEFESA` dão a alguns jogadores uma chance pequena de +1 no
        atributo correspondente (jovens aproveitam mais), devolvem pouca forma
        física e cobram risco pequeno de lesão leve. `FISICO` fica no meio:
        recupera bem a stamina, desenvolve velocidade e é o que mais machuca.
        `DESCANSO` é o único sem risco, e o que mais recupera. Nenhum foco
        apaga o desgaste de quem jogou (a fadiga continua acumulando), e
        nenhum recupera zero — foco técnico custa forma física, mas não deixa
        o time preso no piso. Os números vivem no backend
        (`enum class TrainingFocus`); o cliente só escolhe e exibe.
      enum: [ATAQUE, DEFESA, FISICO, DESCANSO]
      default: DESCANSO
      x-labels:
        ATAQUE: Ataque
        DEFESA: Defesa
        FISICO: Físico
        DESCANSO: Descanso

    TrainedAttribute:
      type: string
      description: Atributo desenvolvido por um foco de treino (issue #58).
      enum: [SHOOTING, DEFENDING, PACE]
      x-labels:
        SHOOTING: Finalização
        DEFENDING: Marcação
        PACE: Velocidade

    # ─── Player & Club ────────────────────────────────────────────────────
    Player:
      type: object
      required:
        - id
        - name
        - position
        - overall
        - pace
        - shooting
        - passing
        - defending
        - stamina
        - salary
        - age
        - goals
        - yellowCards
        - redCards
        - availability
        - nationality
        - suspensions
        - marketValue
      properties:
        id:         { type: integer, format: int64 }
        name:       { type: string }
        position:   { $ref: '#/components/schemas/Position' }
        overall:    { type: integer, minimum: 0, maximum: 99 }
        pace:       { type: integer, minimum: 0, maximum: 99 }
        shooting:   { type: integer, minimum: 0, maximum: 99 }
        passing:    { type: integer, minimum: 0, maximum: 99 }
        defending:  { type: integer, minimum: 0, maximum: 99 }
        stamina:
          type: integer
          minimum: 0
          maximum: 100
          description: |
            Forma física (issue #54). Titulares perdem 10–25 por rodada (piso
            40) e reservas recuperam. Abaixo de 70 o rendimento do jogador cai
            proporcionalmente — a UI não recalcula isso, só exibe.
        salary:
          type: integer
          format: int64
          minimum: 0
          description: |
            Salário mensal, em centavos de USD — o do contrato (issue #136).
            Zero para o jogador livre do mercado, que não tem contrato.
        age:
          type: integer
          minimum: 15
          maximum: 50
          description: |
            Idade (issue #55). Na virada de temporada todo jogador ganha um ano:
            até 23 tende a evoluir, de 24 a 29 oscila pouco e a partir dos 30
            tende a regredir. Veterano de overall baixo se aposenta e sai do
            elenco — a UI não recalcula nada disso, só exibe.
        goals:      { type: integer, minimum: 0, description: Gols na temporada }
        yellowCards: { type: integer, minimum: 0, description: Cartões amarelos na temporada }
        redCards:    { type: integer, minimum: 0, description: Cartões vermelhos na temporada }
        availability: { $ref: '#/components/schemas/Availability' }
        star:
          type: boolean
          description: Derivado de `overall >= 82` (computado pelo backend)
        nationality:
          $ref: '#/components/schemas/Country'
          description: |
            Nacionalidade esportiva (issue #123): a seleção que o jogador pode
            defender. Sempre presente.
        secondNationality:
          $ref: '#/components/schemas/Country'
          description: |
            Segunda nacionalidade, se houver — ausente quando não há. Só conta
            para a regra de estrangeiro (calculada pelo backend), nunca para a
            seleção.
        suspensions:
          type: array
          items: { $ref: '#/components/schemas/Suspension' }
          description: |
            Suspensões automáticas em vigor (issue #130), no máximo uma por
            competição — vazia quando não há. 3 amarelos numa competição ou um
            vermelho suspendem os próximos jogos DAQUELA competição; o apito
            inicial deixa o jogador fora deles mesmo se estiver na escalação.
        foreign:
          type: boolean
          description: |
            Ocupa vaga de estrangeiro no clube dele (issue #130) — calculado
            pelo backend a partir das nacionalidades e do país do clube.
            Presente só no `squad` de um `Club`; ausente no mercado.
        marketValue:
          type: integer
          format: int64
          minimum: 0
          description: |
            Valor de mercado em centavos de USD (issue #135), calculado pelo
            backend a partir do overall, da idade, do contrato restante e da
            força da liga. No `squad` de um `Club`, é o valor do jogador no
            clube (com o prêmio ou deságio da liga dele); fora de elenco
            (mercado, eventos de rodada), é o valor de referência do mercado,
            sobre o qual sai o preço de anúncio. A venda rápida ao mercado paga
            uma fração do valor no clube. A UI só exibe — nunca recalcula.
        contract:
          $ref: '#/components/schemas/Contract'
          description: |
            Contrato em vigor (issue #136) — ausente para o jogador livre
            (mercado).

    Suspension:
      type: object
      required: [competitionId, competitionName, matchesLeft]
      properties:
        competitionId:   { type: string, description: 'Id da competição (ex.: `liga-d1`, `copa`)' }
        competitionName: { type: string }
        matchesLeft:
          type: integer
          minimum: 1
          description: Jogos DO CLUBE naquela competição que o jogador ainda cumpre.

    Availability:
      description: |
        Disponibilidade do jogador (issue #54). `oneOf` + `discriminator`
        espelhando o `sealed interface Availability` do domínio Kotlin: a
        duração da lesão só existe DENTRO da variante `Injured`, então não há
        como representar "lesionado sem duração". No TS, desambigua com
        `switch (player.availability.type)` exaustivo.
      oneOf:
        - $ref: '#/components/schemas/AvailableStatus'
        - $ref: '#/components/schemas/InjuredStatus'
        - $ref: '#/components/schemas/InternationalDutyStatus'
      discriminator:
        propertyName: type
        mapping:
          Available: '#/components/schemas/AvailableStatus'
          Injured:   '#/components/schemas/InjuredStatus'
          OnInternationalDuty: '#/components/schemas/InternationalDutyStatus'

    AvailableStatus:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [Available] }

    InjuredStatus:
      type: object
      required: [type, roundsOut]
      properties:
        type: { type: string, enum: [Injured] }
        roundsOut:
          type: integer
          minimum: 1
          description: |
            JOGOS DO CLUBE restantes de afastamento (issue #125): a lesão só
            anda quando o clube entra em campo, quantas semanas passarem.
            Chega a zero e o jogador volta.

    Lineup:
      type: object
      required: [formation, playerIds]
      properties:
        formation:
          $ref: '#/components/schemas/Formation'
        playerIds:
          type: array
          minItems: 0
          maxItems: 11
          items: { type: integer, format: int64 }
          description: |
            IDs dos titulares em ordem correspondente aos slots da formação.
        posture:
          $ref: '#/components/schemas/Posture'
          description: |
            Postura salva com a escalação (issue #56). O backend sempre a
            devolve — escalação gravada antes da tática existir desserializa
            no default. Opcional no schema porque o cliente pode ter omitido
            ao salvar; ausente, trate como `BALANCED`.

    Club:
      type: object
      required:
        - id
        - name
        - cash
        - stadiumCapacity
        - squad
        # Sempre presente: quem nunca escolheu vem com o default `DESCANSO`,
        # então o cliente nunca precisa adivinhar o foco em vigor.
        - trainingFocus
        # Idem: quem nunca mexeu no ingresso vem com US$ 10 (`1000`).
        - ticketPriceCents
        # Escalação efetiva (issue #87): sempre derivável do elenco, então
        # sempre presente — a UI nunca recalcula quem entra em campo.
        - effectiveLineup
        - lineupIsDefault
        - lineupAdjusted
        - country
      properties:
        id:               { type: integer, format: int64 }
        name:             { type: string }
        cash:             { type: integer, format: int64, description: Caixa em centavos de USD }
        stadiumCapacity:  { type: integer, minimum: 0 }
        squad:
          type: array
          items: { $ref: '#/components/schemas/Player' }
        lineup:
          $ref: '#/components/schemas/Lineup'
          description: Escalação salva (pode estar incompleta)
        effectiveLineup:
          $ref: '#/components/schemas/Lineup'
          description: |
            Escalação EFETIVA (issue #87) — o time que a engine põe em campo se
            a rodada começar agora. Sem escalação salva, é o 4-4-2 automático
            com os 11 primeiros aptos do elenco; com escalação salva, é ela com
            lesionados/vendidos trocados por reservas aptos, na ordem do elenco.
            Desde a issue #130 é a do próximo jogo de LIGA: sem os suspensos na
            liga e dentro de `foreignPlayerLimit`.
            Pode ter menos de 11 se o elenco não tiver aptos suficientes. A regra
            vive no backend (`Club.startingLineup()`); o cliente só exibe.
        lineupIsDefault:
          type: boolean
          description: |
            `true` quando não há escalação salva (`lineup` ausente) e
            `effectiveLineup` é a automática.
        lineupAdjusted:
          type: boolean
          description: |
            `true` quando há escalação salva mas `effectiveLineup` difere dela
            (titular lesionado, suspenso, vendido ou acima do limite de
            estrangeiros foi substituído, ou a vaga ficou vazia por falta de
            reserva apto). Sempre `false`
            quando `lineupIsDefault` é `true`.
        ownerId:
          type: integer
          format: int64
          nullable: true
          description: |
            Dono humano do clube; `null` significa controlado pela IA.
            Preparado para multiplayer (Fase 5).
        trainingFocus:
          $ref: '#/components/schemas/TrainingFocus'
          description: |
            Foco de treino em vigor (issue #58). Vale entre rodadas e para o
            elenco inteiro — fica valendo até o técnico trocar.
        ticketPriceCents:
          type: integer
          format: int64
          minimum: 200
          maximum: 4000
          description: |
            Preço do ingresso em vigor, em centavos de USD (issue #59). Vale até o
            técnico trocar; quem nunca mexeu cobra `1000` (US$ 10).
        country:
          $ref: '#/components/schemas/Country'
          description: País da federação do clube (issue #123). Sempre presente.
        foreignPlayerLimit:
          type: integer
          minimum: 0
          description: |
            Máximo de estrangeiros (`Player.foreign`) na escalação (issue #130)
            — o da liga do clube; 9 no Brasileirão 2026. Ausente = sem limite.
            Salvar acima dele devolve `TOO_MANY_FOREIGN_PLAYERS`.

    # ─── Requests ─────────────────────────────────────────────────────────
    LineupRequest:
      type: object
      required: [formation, playerIds]
      properties:
        formation: { $ref: '#/components/schemas/Formation' }
        playerIds:
          type: array
          minItems: 11
          maxItems: 11
          items: { type: integer, format: int64 }
        posture:
          $ref: '#/components/schemas/Posture'
          description: Postura da partida; omitida, o backend assume `BALANCED`.

    TrainingFocusRequest:
      type: object
      required: [focus]
      properties:
        focus: { $ref: '#/components/schemas/TrainingFocus' }

    TicketPriceRequest:
      type: object
      required: [ticketPriceCents]
      properties:
        ticketPriceCents:
          type: integer
          format: int64
          minimum: 200
          maximum: 4000
          description: |
            Novo preço do ingresso em centavos de USD (issue #59). Fora de
            `200..4000` o backend responde 400 `TICKET_PRICE_OUT_OF_RANGE` —
            a faixa é regra de domínio, o `minimum`/`maximum` aqui só documenta
            e ajuda o cliente a validar antes de mandar.

    ExpandStadiumRequest:
      type: object
      required: [additionalSeats]
      properties:
        additionalSeats:
          type: integer
          minimum: 1000
          description: |
            Quantidade de novos assentos a adicionar. Abaixo de `1000` o
            backend responde 400 `INVALID_STADIUM_EXPANSION` — o mínimo é regra
            de domínio, o `minimum` aqui só documenta (issue #79).

    BuyPlayerRequest:
      type: object
      required: [clubId, playerId, contract]
      properties:
        clubId:   { type: integer, format: int64 }
        playerId: { type: integer, format: int64 }
        contract: { $ref: '#/components/schemas/ContractOffer' }

    SellPlayerRequest:
      type: object
      required: [clubId, playerId]
      properties:
        clubId:   { type: integer, format: int64 }
        playerId: { type: integer, format: int64 }

    # ─── Market ───────────────────────────────────────────────────────────
    MarketEntry:
      type: object
      required: [player, price]
      properties:
        player: { $ref: '#/components/schemas/Player' }
        price:
          type: integer
          format: int64
          description: |
            Taxa de compra (em centavos de USD). Zero para o livre do pool —
            contrato vencido, dispensado pela IA ou do mercado inicial (issue
            #139). Só quem foi vendido na venda rápida tem taxa: 125% do
            `player.marketValue` de referência (issue #135), para vender e
            recontratar não dar lucro.

    MarketPage:
      description: |
        Uma página da busca no pool de livres (issue #139). `page` começa em 0;
        `totalPages` é ao menos 1 (a página 0 de uma busca vazia existe, sem
        itens).
      type: object
      required: [items, page, size, totalItems, totalPages]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/MarketEntry' }
        page:       { type: integer, minimum: 0 }
        size:       { type: integer, minimum: 1, maximum: 100 }
        totalItems: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 1 }

    MarketSort:
      description: |
        Critério de ordenação da busca do mercado. `value` é o valor de
        mercado de referência (`player.marketValue`). Empate cai no nome e
        depois no id, sempre crescentes.
      type: string
      enum: [price, value, overall, age]

    TransferResult:
      description: |
        Mapeia `sealed interface TransferResult` no domínio Kotlin.
        Discriminado por `type` — frontend usa `switch (result.type)` exaustivo.
      oneOf:
        - $ref: '#/components/schemas/TransferSuccess'
        - $ref: '#/components/schemas/InsufficientFunds'
        - $ref: '#/components/schemas/SquadFull'
        - $ref: '#/components/schemas/PlayerNotAvailable'
        - $ref: '#/components/schemas/TransferConflict'
        - $ref: '#/components/schemas/TransferWindowClosed'
        - $ref: '#/components/schemas/TransferLimitReached'
        - $ref: '#/components/schemas/PlayerRefused'
      discriminator:
        propertyName: type
        mapping:
          Success:            '#/components/schemas/TransferSuccess'
          InsufficientFunds:  '#/components/schemas/InsufficientFunds'
          SquadFull:          '#/components/schemas/SquadFull'
          PlayerNotAvailable: '#/components/schemas/PlayerNotAvailable'
          Conflict:           '#/components/schemas/TransferConflict'
          TransferWindowClosed: '#/components/schemas/TransferWindowClosed'
          TransferLimitReached: '#/components/schemas/TransferLimitReached'
          PlayerRefused:      '#/components/schemas/PlayerRefused'

    TransferSuccess:
      type: object
      required: [type, club, player]
      properties:
        type:   { type: string, enum: [Success] }
        club:   { $ref: '#/components/schemas/Club' }
        player: { $ref: '#/components/schemas/Player' }

    InsufficientFunds:
      type: object
      required: [type, available, required]
      properties:
        type:      { type: string, enum: [InsufficientFunds] }
        available: { type: integer, format: int64 }
        required:  { type: integer, format: int64 }

    SquadFull:
      type: object
      required: [type, maxSize]
      properties:
        type:    { type: string, enum: [SquadFull] }
        maxSize: { type: integer }

    PlayerNotAvailable:
      type: object
      required: [type, playerId]
      properties:
        type:     { type: string, enum: [PlayerNotAvailable] }
        playerId: { type: integer, format: int64 }

    TransferConflict:
      description: |
        Lock otimista do clube (issue #89): outra operação alterou o clube
        entre a leitura e a gravação, e a transferência NÃO foi aplicada —
        caixa, elenco e mercado ficam como estavam (na compra, o jogador volta
        ao mercado). Recarregue o clube e tente de novo.
      type: object
      required: [type, clubId]
      properties:
        type:   { type: string, enum: [Conflict] }
        clubId: { type: integer, format: int64 }

    # ─── Offers (propostas entre técnicos, issue #63) ─────────────────────
    CreateOfferRequest:
      type: object
      required: [buyerClubId, sellerClubId, playerId, amount, contract]
      properties:
        buyerClubId:  { type: integer, format: int64, description: Clube de quem propõe (o do usuário) }
        sellerClubId: { type: integer, format: int64, description: Clube dono do jogador }
        playerId:     { type: integer, format: int64 }
        amount:
          type: integer
          format: int64
          description: Valor oferecido, em centavos de USD (mínimo US$ 200 — `InvalidAmount` abaixo disso)
        contract:
          $ref: '#/components/schemas/ContractOffer'

    TransferOffer:
      description: |
        Proposta em dinheiro de um técnico por um jogador de outro (issue #63).
        Os nomes são uma foto do momento da proposta: o histórico segue legível
        depois que o jogador muda de clube ou se aposenta.
      type: object
      required:
        - id
        - buyerClubId
        - buyerClubName
        - sellerClubId
        - sellerClubName
        - playerId
        - playerName
        - amount
        - slotsLeft
        - status
      properties:
        id:             { type: integer, format: int64 }
        buyerClubId:    { type: integer, format: int64 }
        buyerClubName:  { type: string }
        sellerClubId:   { type: integer, format: int64 }
        sellerClubName: { type: string }
        playerId:       { type: integer, format: int64 }
        playerName:     { type: string }
        amount:         { type: integer, format: int64, description: Valor em centavos de USD }
        slotsLeft:
          type: integer
          minimum: 0
          description: |
            Encaixes jogados até a proposta expirar sem resposta (issue #125;
            anda a cada encaixe encerrado — semanas sem jogo não contam).
        status: { $ref: '#/components/schemas/OfferStatus' }
        contract:
          $ref: '#/components/schemas/ContractOffer'
      # Exemplo explícito: o Swagger UI não monta um a partir do `oneOf` do
      # `status` e mostrava `"status": {}` (revisão do PR #94).
      example:
        id: 7
        buyerClubId: 1
        buyerClubName: Goal Father FC
        sellerClubId: 2
        sellerClubName: Atlético Bonsucesso
        playerId: 2004
        playerName: Daniel Valente
        amount: 50000000
        slotsLeft: 3
        status: { type: Pending }
        contract: { salary: 300000, years: 3 }

    OfferStatus:
      description: |
        Ciclo de vida da proposta — espelha o `sealed interface OfferStatus` do
        domínio. Só `Pending` tem saída; os demais são terminais. O motivo da
        expiração só existe DENTRO de `Expired`. No TS, `switch (status.type)`
        exaustivo.
      oneOf:
        - $ref: '#/components/schemas/PendingOfferStatus'
        - $ref: '#/components/schemas/AcceptedOfferStatus'
        - $ref: '#/components/schemas/RejectedOfferStatus'
        - $ref: '#/components/schemas/WithdrawnOfferStatus'
        - $ref: '#/components/schemas/ExpiredOfferStatus'
      discriminator:
        propertyName: type
        mapping:
          Pending:   '#/components/schemas/PendingOfferStatus'
          Accepted:  '#/components/schemas/AcceptedOfferStatus'
          Rejected:  '#/components/schemas/RejectedOfferStatus'
          Withdrawn: '#/components/schemas/WithdrawnOfferStatus'
          Expired:   '#/components/schemas/ExpiredOfferStatus'

    PendingOfferStatus:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [Pending] }

    AcceptedOfferStatus:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [Accepted] }

    RejectedOfferStatus:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [Rejected] }

    WithdrawnOfferStatus:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [Withdrawn] }

    ExpiredOfferStatus:
      type: object
      required: [type, reason]
      properties:
        type:   { type: string, enum: [Expired] }
        reason: { $ref: '#/components/schemas/ExpiryReason' }

    ExpiryReason:
      type: string
      enum: [DEADLINE, PLAYER_TRANSFERRED, MANAGER_LEFT, WINDOW_CLOSED]
      description: |
        `DEADLINE` — o prazo em rodadas venceu sem resposta.
        `PLAYER_TRANSFERRED` — o jogador deixou o elenco do vendedor: outra
        proposta por ele foi aceita, ou ele foi vendido ao mercado/se aposentou.
        `MANAGER_LEFT` — o técnico de um dos dois clubes foi demitido: a
        negociação era dele, e o clube (agora da IA) não a herda.
        `WINDOW_CLOSED` — a janela de transferência do comprador fechou (ou
        virou só doméstica, com vendedor de outro país) com a proposta
        pendente (issue #137).

    SquadViolation:
      type: string
      enum: [TOO_FEW_PLAYERS, NO_GOALKEEPER]
      description: |
        Por que o elenco do vendedor ficaria inválido: menos de
        `minSquadSize` jogadores, ou sem o último goleiro.

    TransferOfferResult:
      description: |
        Mapeia os erros de negócio de `OfferResult` no domínio Kotlin (issue
        #63), mais o `Success`. Discriminado por `type` — o frontend usa
        `switch (result.type)` exaustivo. Posse (403) e existência (404) NÃO
        estão aqui: viram status HTTP.

        `InsufficientFunds`, `SquadFull`, `PlayerNotAvailable`, `Conflict`,
        `TransferWindowClosed` e `TransferLimitReached` reusam os schemas do
        `TransferResult` do mercado: mesmo significado, mesma forma. A janela
        é a do COMPRADOR, na criação e no aceite.
      oneOf:
        - $ref: '#/components/schemas/OfferSuccess'
        - $ref: '#/components/schemas/InvalidOfferAmount'
        - $ref: '#/components/schemas/InsufficientFunds'
        - $ref: '#/components/schemas/SquadFull'
        - $ref: '#/components/schemas/PlayerNotAvailable'
        - $ref: '#/components/schemas/SellerNotHuman'
        - $ref: '#/components/schemas/BuyerNotHuman'
        - $ref: '#/components/schemas/SellerSquadInvalid'
        - $ref: '#/components/schemas/OfferAlreadyPending'
        - $ref: '#/components/schemas/OfferNotPending'
        - $ref: '#/components/schemas/OfferExpired'
        - $ref: '#/components/schemas/RoundInProgress'
        - $ref: '#/components/schemas/TransferConflict'
        - $ref: '#/components/schemas/TransferWindowClosed'
        - $ref: '#/components/schemas/TransferLimitReached'
        - $ref: '#/components/schemas/PlayerRefused'
      discriminator:
        propertyName: type
        mapping:
          Success:            '#/components/schemas/OfferSuccess'
          InvalidAmount:      '#/components/schemas/InvalidOfferAmount'
          InsufficientFunds:  '#/components/schemas/InsufficientFunds'
          SquadFull:          '#/components/schemas/SquadFull'
          PlayerNotAvailable: '#/components/schemas/PlayerNotAvailable'
          SellerNotHuman:     '#/components/schemas/SellerNotHuman'
          BuyerNotHuman:      '#/components/schemas/BuyerNotHuman'
          SellerSquadInvalid: '#/components/schemas/SellerSquadInvalid'
          OfferAlreadyPending: '#/components/schemas/OfferAlreadyPending'
          OfferNotPending:    '#/components/schemas/OfferNotPending'
          OfferExpired:       '#/components/schemas/OfferExpired'
          RoundInProgress:    '#/components/schemas/RoundInProgress'
          Conflict:           '#/components/schemas/TransferConflict'
          TransferWindowClosed: '#/components/schemas/TransferWindowClosed'
          TransferLimitReached: '#/components/schemas/TransferLimitReached'
          PlayerRefused:      '#/components/schemas/PlayerRefused'

    OfferSuccess:
      description: Comando aplicado — `offer` traz o estado novo da proposta.
      type: object
      required: [type, offer]
      properties:
        type:  { type: string, enum: [Success] }
        offer: { $ref: '#/components/schemas/TransferOffer' }

    InvalidOfferAmount:
      type: object
      required: [type, minimum]
      properties:
        type:    { type: string, enum: [InvalidAmount] }
        minimum: { type: integer, format: int64, description: Menor proposta aceita, em centavos de USD }

    SellerNotHuman:
      description: O clube vendedor é da IA — proposta é só entre técnicos humanos.
      type: object
      required: [type, clubId]
      properties:
        type:   { type: string, enum: [SellerNotHuman] }
        clubId: { type: integer, format: int64 }

    BuyerNotHuman:
      description: |
        O clube comprador não tem mais técnico humano (o técnico que propôs foi
        demitido) — o clube da IA não paga a proposta dele.
      type: object
      required: [type, clubId]
      properties:
        type:   { type: string, enum: [BuyerNotHuman] }
        clubId: { type: integer, format: int64 }

    SellerSquadInvalid:
      type: object
      required: [type, violation, minSquadSize]
      properties:
        type:         { type: string, enum: [SellerSquadInvalid] }
        violation:    { $ref: '#/components/schemas/SquadViolation' }
        minSquadSize: { type: integer }

    OfferAlreadyPending:
      description: |
        O comprador já tem uma proposta pendente por este jogador (`offerId`).
        Para mudar o valor, retire-a e faça outra.
      type: object
      required: [type, offerId]
      properties:
        type:    { type: string, enum: [OfferAlreadyPending] }
        offerId: { type: integer, format: int64 }

    OfferNotPending:
      description: A proposta já foi aceita, recusada ou retirada.
      type: object
      required: [type, offerId, status]
      properties:
        type:    { type: string, enum: [OfferNotPending] }
        offerId: { type: integer, format: int64 }
        status:  { $ref: '#/components/schemas/OfferStatus' }

    OfferExpired:
      type: object
      required: [type, offerId, reason]
      properties:
        type:    { type: string, enum: [OfferExpired] }
        offerId: { type: integer, format: int64 }
        reason:  { $ref: '#/components/schemas/ExpiryReason' }

    RoundInProgress:
      description: Aceite bloqueado enquanto a rodada é simulada — o jogador não troca de clube no meio dela.
      type: object
      required: [type, matchday]
      properties:
        type:     { type: string, enum: [RoundInProgress] }
        matchday:
          type: string
          description: 'Chave do encaixe em simulação (issue #125)'

    # ─── Match (sealed MatchEvent + summary) ─────────────────────────────
    MatchEvent:
      description: |
        Mapeia `sealed interface MatchEvent` no domínio Kotlin. Cada mensagem
        do WebSocket `/ws/matches/{id}` é um `MatchEvent` serializado.

        Discriminado por `type` — frontend usa `switch (event.type)` exaustivo
        (TS infere o tipo correto em cada branch).
      oneOf:
        - $ref: '#/components/schemas/KickOffEvent'
        - $ref: '#/components/schemas/GoalEvent'
        - $ref: '#/components/schemas/MissEvent'
        - $ref: '#/components/schemas/CardEvent'
        - $ref: '#/components/schemas/InjuryEvent'
        - $ref: '#/components/schemas/SaveEvent'
        - $ref: '#/components/schemas/PenaltyShootoutEvent'
        - $ref: '#/components/schemas/FullTimeEvent'
      discriminator:
        propertyName: type
        mapping:
          KickOff:  '#/components/schemas/KickOffEvent'
          Goal:     '#/components/schemas/GoalEvent'
          Miss:     '#/components/schemas/MissEvent'
          Card:     '#/components/schemas/CardEvent'
          Injury:   '#/components/schemas/InjuryEvent'
          Save:     '#/components/schemas/SaveEvent'
          PenaltyShootout: '#/components/schemas/PenaltyShootoutEvent'
          FullTime: '#/components/schemas/FullTimeEvent'

    MatchEventBase:
      type: object
      required: [type, minute]
      properties:
        type:   { type: string }
        minute: { type: integer, minimum: 0, maximum: 120 }

    KickOffEvent:
      description: |
        Primeiro evento do stream. Carrega metadados da partida (nome, força
        agregada e postura dos times) para que o cliente possa renderizar o
        placar antes que outros eventos cheguem.
      allOf:
        - $ref: '#/components/schemas/MatchEventBase'
        - type: object
          required:
            - type
            - homeClubName
            - awayClubName
            - homeStrength
            - awayStrength
            - homePosture
            - awayPosture
          properties:
            type:         { type: string, enum: [KickOff] }
            homeClubName: { type: string }
            awayClubName: { type: string }
            homeStrength: { type: number, minimum: 0, maximum: 99 }
            awayStrength: { type: number, minimum: 0, maximum: 99 }
            homePosture:
              $ref: '#/components/schemas/Posture'
              description: |
                Postura com que o mandante entrou em campo (issue #56) — é como
                o técnico descobre que o adversário se fechou contra ele.
            awayPosture:
              $ref: '#/components/schemas/Posture'
              description: Postura com que o visitante entrou em campo.
            homeClubId:
              type: integer
              format: int64
              description: |
                Id do mandante. Com ele o drill-down resolve os nomes dos
                jogadores mesmo quando a partida já saiu da rodada corrente.
                Ausente em partida sem clube persistido.
            awayClubId:
              type: integer
              format: int64
              description: Id do visitante (mesma regra de `homeClubId`).

    GoalEvent:
      allOf:
        - $ref: '#/components/schemas/MatchEventBase'
        - type: object
          required: [type, scorerId, home]
          properties:
            type:     { type: string, enum: [Goal] }
            scorerId: { type: integer, format: int64 }
            home:
              type: boolean
              description: true = gol do mandante; false = visitante

    MissEvent:
      description: |
        Chute para fora (issue #57). Autor sorteado com o mesmo peso por
        posição do gol — goleiro não finaliza.
      allOf:
        - $ref: '#/components/schemas/MatchEventBase'
        - type: object
          required: [type, playerId, home]
          properties:
            type:     { type: string, enum: [Miss] }
            playerId: { type: integer, format: int64 }
            home:
              type: boolean
              description: true = finalização do mandante; false = do visitante

    CardEvent:
      allOf:
        - $ref: '#/components/schemas/MatchEventBase'
        - type: object
          required: [type, playerId, red, home]
          properties:
            type:     { type: string, enum: [Card] }
            playerId: { type: integer, format: int64 }
            red:      { type: boolean, description: true = vermelho; false = amarelo }
            home:
              type: boolean
              description: |
                Lado do jogador advertido (issue #57). Necessário para as
                estatísticas de disciplina do `FullTime`, já que o `playerId`
                sozinho não diz a que elenco ele pertence.

    InjuryEvent:
      allOf:
        - $ref: '#/components/schemas/MatchEventBase'
        - type: object
          required: [type, playerId, roundsOut]
          properties:
            type:     { type: string, enum: [Injury] }
            playerId: { type: integer, format: int64 }
            roundsOut:
              type: integer
              minimum: 1
              description: |
                Jogos do clube de afastamento sorteados com o RNG da própria
                partida (issue #54; contados em jogos desde a #125). Viaja no evento para que o replay do stream
                reproduza exatamente a mesma lesão.

    SaveEvent:
      description: |
        Defesa do goleiro. `home` é o lado de QUEM DEFENDEU — a finalização
        veio do outro time (issue #57).
      allOf:
        - $ref: '#/components/schemas/MatchEventBase'
        - type: object
          required: [type, home]
          properties:
            type: { type: string, enum: [Save] }
            goalkeeperId:
              type: integer
              format: int64
              nullable: true
              description: |
                Goleiro que defendeu. Ausente/nulo apenas quando o time entrou
                em campo sem goleiro escalado (elenco incompleto).
            home:
              type: boolean
              description: true = defesa do goleiro do mandante

    PenaltyShootoutEvent:
      description: |
        Disputa de pênaltis (issue #61). Só existe em jogo de COPA que terminou
        empatado no tempo normal, e chega ANTES do `FullTime` — que segue
        sendo o último evento e carrega o placar dos 90 minutos. Sorteada com
        o RNG da própria partida: mesma seed, mesma disputa. Os placares nunca
        empatam e resumem `kicks`.
      allOf:
        - $ref: '#/components/schemas/MatchEventBase'
        - type: object
          required: [type, homeScore, awayScore, kicks]
          properties:
            type:      { type: string, enum: [PenaltyShootout] }
            homeScore: { type: integer, minimum: 0 }
            awayScore: { type: integer, minimum: 0 }
            kicks:
              type: array
              description: Cobranças na ordem em que saíram (mandante bate primeiro)
              items: { $ref: '#/components/schemas/PenaltyKick' }

    PenaltyKick:
      type: object
      required: [home, scored]
      properties:
        playerId:
          type: integer
          format: int64
          nullable: true
          description: |
            Batedor. Ausente/nulo só quando o lado não tinha ninguém em campo —
            a cobrança conta como perdida.
        home:   { type: boolean, description: true = cobrança do mandante }
        scored: { type: boolean }

    FullTimeEvent:
      description: |
        Apito final. Além do placar, carrega o sumário da partida (issue #57)
        — derivado dos próprios eventos emitidos, nunca calculado à parte.
      allOf:
        - $ref: '#/components/schemas/MatchEventBase'
        - type: object
          required: [type, homeGoals, awayGoals, stats]
          properties:
            type:      { type: string, enum: [FullTime] }
            homeGoals: { type: integer, minimum: 0 }
            awayGoals: { type: integer, minimum: 0 }
            stats:     { $ref: '#/components/schemas/MatchStats' }

    MatchStats:
      description: Estatísticas dos dois lados, na mesma orientação do placar.
      type: object
      required: [home, away]
      properties:
        home: { $ref: '#/components/schemas/TeamStats' }
        away: { $ref: '#/components/schemas/TeamStats' }

    TeamStats:
      description: |
        Números de um time na partida. Projeção do stream de eventos: nada
        aqui é estado próprio, então o sumário nunca diverge do feed.
      type: object
      required: [shots, shotsOnTarget, saves, yellowCards, redCards]
      properties:
        shots:
          type: integer
          minimum: 0
          description: 'Finalizações: gols + defesas do goleiro adversário + chutes para fora'
        shotsOnTarget:
          type: integer
          minimum: 0
          description: 'Delas, as que foram no gol: gols + defesas do goleiro adversário'
        saves:
          type: integer
          minimum: 0
          description: Defesas feitas pelo goleiro DESTE time
        yellowCards: { type: integer, minimum: 0 }
        redCards:    { type: integer, minimum: 0 }

    # ─── League ───────────────────────────────────────────────────────────
    StandingRow:
      type: object
      required:
        - position
        - clubId
        - clubName
        - played
        - wins
        - draws
        - losses
        - goalsFor
        - goalsAgainst
        - goalDifference
        - points
        - zone
      properties:
        position:        { type: integer, minimum: 1 }
        clubId:          { type: integer, format: int64 }
        clubName:        { type: string }
        played:          { type: integer, minimum: 0 }
        wins:            { type: integer, minimum: 0 }
        draws:           { type: integer, minimum: 0 }
        losses:          { type: integer, minimum: 0 }
        goalsFor:        { type: integer, minimum: 0 }
        goalsAgainst:    { type: integer, minimum: 0 }
        goalDifference:  { type: integer }
        points:          { type: integer, minimum: 0 }
        zone:            { $ref: '#/components/schemas/TableZone' }

    TableZone:
      type: string
      enum: [NONE, QUALIFICATION, PROMOTION, PLAYOFF, RELEGATION]
      description: |
        Faixa da POSIÇÃO na tabela (issue #128), calculada no backend pelas
        regras de vaga da competição — a UI só pinta. `QUALIFICATION` é vaga em
        outra competição (a continental no MVP), `PROMOTION` acesso, `PLAYOFF`
        playoff de acesso/rebaixamento, `RELEGATION` rebaixamento e `NONE` sem
        faixa. Faixas nominais: o G-6 pinta 1º–6º mesmo quando a cascata (campeão
        da copa já classificado) leva o 7º. Liga sem regra (as europeias do MVP,
        fechadas até a issue #146) vem toda `NONE`.

    Standings:
      description: |
        Tabela de UMA liga em uma temporada (issue #131: cada liga do mundo —
        Série A, Série B, Premier League… — tem a sua; `division` é o `tier`
        da liga no país). A UI pinta as faixas pela
        `zone` de cada linha (issue #128), sem duplicar a regra de negócio no
        cliente. `promotionSpots` / `relegationSpots` contam as posições de
        acesso/rebaixamento das mesmas regras (0 quando não há para onde subir
        ou descer) e ficam por compatibilidade.
      type: object
      required: [season, division, round, rows, promotionSpots, relegationSpots, competitionId, competitionName, country, seasonLabel]
      properties:
        season:   { type: integer, description: Ano de INÍCIO da temporada da liga }
        seasonLabel:
          type: string
          description: '`2026` quando a temporada cabe num ano; `2026/27` quando atravessa a virada (issue #131)'
        competitionId:
          type: string
          description: Liga desta tabela (issue #131)
          example: bra-serie-a
        competitionName: { type: string, example: Campeonato Brasileiro Série A }
        country:  { $ref: '#/components/schemas/Country' }
        division: { type: integer, minimum: 1, description: 'Divisão (1 = elite)' }
        round:
          type: integer
          minimum: 0
          description: |
            Rodada DE LIGA concluída. Com a copa no calendário (issue #61) ela
            difere do número da data: a 3ª rodada de liga pode ser a data 5.
        promotionSpots:
          type: integer
          minimum: 0
          description: Posições do topo que sobem de divisão na virada (0 na elite)
        relegationSpots:
          type: integer
          minimum: 0
          description: Posições do fundo que descem de divisão na virada (0 na última)
        rows:
          type: array
          items: { $ref: '#/components/schemas/StandingRow' }

    SeasonStanding:
      description: |
        Campanha de um clube numa temporada encerrada. A linha da tabela viaja
        inteira em `row` — o que a história acrescenta é a divisão (a linha
        sozinha não diz em que tier aquele 1º lugar valeu) e o aproveitamento
        já calculado, gravado no snapshot em vez de derivado na leitura: se o
        critério de pontuação mudar, as temporadas antigas continuam contando
        a verdade da época delas.
      type: object
      required: [division, row, pointsPercentage]
      properties:
        division: { type: integer, minimum: 1, description: 'Divisão (1 = elite)' }
        row:      { $ref: '#/components/schemas/StandingRow' }
        pointsPercentage:
          type: integer
          minimum: 0
          maximum: 100
          description: Aproveitamento — pontos conquistados sobre os disputados

    SeasonTopScorer:
      description: |
        Artilheiro da liga na temporada — o jogador com mais gols entre TODOS
        os clubes, humanos ou da IA. Nome e clube são copiados, não
        referenciados por id: o artilheiro pode se aposentar na mesma virada
        que grava o snapshot e sumir da base de jogadores.
      type: object
      required: [playerId, playerName, clubId, clubName, goals]
      properties:
        playerId:   { type: integer, format: int64 }
        playerName: { type: string }
        clubId:     { type: integer, format: int64 }
        clubName:   { type: string }
        goals:      { type: integer, minimum: 1 }

    SeasonRecord:
      description: |
        Snapshot imutável da temporada encerrada de UM país. Gravado na
        virada daquele país, ANTES de a tabela e as estatísticas dos jogadores
        serem zeradas, e nunca reescrito (append-only, uma linha por
        temporada + país — issue #131).

        `finalStandings` já vem na ordem de exibição: elite primeiro e, dentro
        de cada divisão, da 1ª à última posição. `champion` é a primeira linha
        da elite, repetida para a listagem não precisar reabrir a
        classificação. `topScorer` é omitido quando ninguém marcou na
        temporada inteira.
      type: object
      required: [season, champion, finalStandings]
      properties:
        season:    { type: integer, description: Ano da temporada encerrada }
        champion:  { $ref: '#/components/schemas/SeasonStanding' }
        finalStandings:
          type: array
          description: Classificação final de todas as divisões, da elite para baixo
          items: { $ref: '#/components/schemas/SeasonStanding' }
        topScorer: { $ref: '#/components/schemas/SeasonTopScorer' }
        cupChampion:
          $ref: '#/components/schemas/CupClub'
          description: |
            Campeão da copa mata-mata da temporada (issue #61). Omitido quando
            não houve copa ou ela não chegou à final.
        country:
          $ref: '#/components/schemas/Country'
          description: |
            País da temporada (issue #131): cada país vira no seu tempo e tem o
            seu record. Omitido nos records anteriores ao mundo do MVP (que
            eram só do Brasil).
        seasonLabel:
          type: string
          description: '`2026` ou `2026/27` (issue #131); omitido nos records antigos'
        continentalChampions:
          type: array
          description: |
            Campeões das continentais que fecharam com a temporada deste país
            (issue #132): a Libertadores fecha com o Brasil. Omitido quando
            não houve.
          items: { $ref: '#/components/schemas/ContinentalTitle' }

    CareerCampaign:
      description: Uma temporada da carreira — em que ano foi e como o clube terminou.
      type: object
      required: [season, standing]
      properties:
        season:   { type: integer }
        standing: { $ref: '#/components/schemas/SeasonStanding' }

    ClubCareer:
      description: |
        Perfil do técnico visto pelo clube que ele comanda. É uma PROJEÇÃO dos
        `SeasonRecord`, não um agregado persistido — o backend a deriva para
        que o cliente não reimplemente o critério de "melhor campanha"
        (divisão pesa mais que posição, que pesa mais que pontos).

        `titles` guarda as temporadas do título, não um contador: o número sai
        do tamanho da lista e "campeão em 2027 e 2031" é o que o técnico quer
        ler. `bestCampaign` só falta se a carreira estiver vazia.
      type: object
      required: [clubId, clubName, seasonsPlayed, titles, cupTitles]
      properties:
        clubId:        { type: integer, format: int64 }
        clubName:      { type: string }
        seasonsPlayed: { type: integer, minimum: 0 }
        titles:
          type: array
          description: Temporadas em que o clube foi campeão (crescente)
          items: { type: integer }
        cupTitles:
          type: array
          description: Temporadas em que o clube venceu a copa (crescente) — issue #61
          items: { type: integer }
        bestCampaign: { $ref: '#/components/schemas/CareerCampaign' }

    RoundStatus:
      type: string
      description: Estado da rodada ou de uma partida da rodada
      enum: [Scheduled, InProgress, Finished]

    RoundMatch:
      description: |
        Estado de uma partida individual dentro de um encaixe. Desde o
        calendário semanal (issue #125) um encaixe pode juntar jogos de várias
        competições, então o que a partida disputa (`stage`) e de qual
        competição ela é vêm em CADA partida. `division` permite à UI agrupar
        os jogos de liga.
      type: object
      required:
        - matchId
        - homeClubId
        - awayClubId
        - homeClubName
        - awayClubName
        - status
        - homeGoals
        - awayGoals
        - minute
        - division
        - stage
        - competitionId
        - competitionName
      properties:
        matchId:       { type: integer, format: int64 }
        homeClubId:    { type: integer, format: int64 }
        awayClubId:    { type: integer, format: int64 }
        homeClubName:  { type: string }
        awayClubName:  { type: string }
        status:        { $ref: '#/components/schemas/RoundStatus' }
        homeGoals:     { type: integer, minimum: 0 }
        awayGoals:     { type: integer, minimum: 0 }
        minute:        { type: integer, minimum: 0, maximum: 120 }
        division:
          type: integer
          minimum: 1
          description: |
            Divisão da partida (1 = elite). Em data de copa, que mistura
            divisões, é a divisão do mandante.
        penalties:
          $ref: '#/components/schemas/PenaltyScore'
          description: |
            Disputa de pênaltis (issue #61) — só em jogo de copa encerrado
            empatado. Omitido nos demais.
        stage:
          $ref: '#/components/schemas/RoundStage'
        competitionId:
          type: string
          description: 'Competição da partida (`liga-d1`, `copa`…), issue #125'
        competitionName:
          type: string
          description: Nome da competição, foto do momento como os nomes dos clubes
        neutralVenue:
          type: string
          description: |
            Sede neutra do jogo (issue #132) — só a final única da
            Libertadores. Ninguém joga em casa, então ninguém fatura
            bilheteria. Omitido no estádio do mandante.

    Round:
      description: |
        Os jogos de UM encaixe do calendário semanal (issue #125): todas as
        partidas de todas as competições marcadas para aquela quarta ou
        domingo. `matchday` identifica o encaixe (rota do WS e chave da
        prontidão) e nunca se repete entre temporadas.
      type: object
      required: [matchday, season, status, matches]
      properties:
        matchday: { $ref: '#/components/schemas/Matchday' }
        season:
          type: integer
          description: Ano da temporada que o encaixe disputa (ano civil no Brasil)
        status:  { $ref: '#/components/schemas/RoundStatus' }
        matches:
          type: array
          items: { $ref: '#/components/schemas/RoundMatch' }

    Slot:
      type: string
      description: |
        Os dois encaixes de jogo da semana (issue #125): meio de semana
        (quarta) e fim de semana (domingo). Ligas preferem o fim de semana;
        copas e continentais, o meio.
      enum: [MIDWEEK, WEEKEND]

    Matchday:
      description: |
        Um encaixe do calendário (issue #125): semana ISO + slot. `key` é a
        identidade estável; os demais campos são a mesma informação já
        decomposta para a UI.
      type: object
      required: [key, year, week, slot, date]
      properties:
        key:
          type: string
          description: Identidade do encaixe, usada no WebSocket e na prontidão
          example: 2026-W05-WEEKEND
        year:
          type: integer
          description: Ano da SEMANA ISO (pode diferir do ano civil na virada)
        week: { type: integer, minimum: 1, maximum: 53 }
        slot: { $ref: '#/components/schemas/Slot' }
        date:
          type: string
          format: date
          description: O dia do jogo (quarta ou domingo)

    Calendar:
      description: 'Relógio do jogo e próximo jogo do clube (issue #125).'
      type: object
      properties:
        current:
          $ref: '#/components/schemas/Matchday'
          description: Encaixe corrente; ausente sem calendário
        season:
          type: integer
          description: |
            Com `clubId`, o ano de INÍCIO da temporada da liga do clube (issue
            #131: o técnico da Premier League vê 2026 em janeiro de 2027); sem
            ele, o ano civil do encaixe corrente.
        seasonLabel:
          type: string
          description: |
            Rótulo da temporada da liga do clube — `2026` ou `2026/27` (issue
            #131). Ausente sem `clubId` (o mundo não tem "a" temporada).
        nextMatch:
          $ref: '#/components/schemas/NextMatch'
          description: Próximo jogo do clube pedido em `clubId`; ausente sem jogo marcado

    NextMatch:
      type: object
      required: [matchday, match]
      properties:
        matchday: { $ref: '#/components/schemas/Matchday' }
        match:    { $ref: '#/components/schemas/RoundMatch' }

    RoundStage:
      description: |
        Mapeia o `sealed interface RoundStage` do domínio Kotlin — o que UMA
        partida disputa (issue #125: por partida, não por rodada). Discriminado
        por `type` — a UI usa `switch (stage.type)` exaustivo para decidir o
        que mostrar (tabela × chave, rodada × fase).
      oneOf:
        - $ref: '#/components/schemas/LeagueRoundStage'
        - $ref: '#/components/schemas/CupRoundStage'
        - $ref: '#/components/schemas/GroupRoundStage'
      discriminator:
        propertyName: type
        mapping:
          League: '#/components/schemas/LeagueRoundStage'
          Cup:    '#/components/schemas/CupRoundStage'
          Group:  '#/components/schemas/GroupRoundStage'

    LeagueRoundStage:
      type: object
      required: [type, matchday]
      properties:
        type: { type: string, enum: [League] }
        matchday:
          type: integer
          minimum: 1
          description: Rodada DA LIGA (1..N-1 do turno) disputada neste jogo

    CupRoundStage:
      description: |
        Jogo de copa (issue #131): a fase pelo nome (vem do formato da
        competição) e qual jogo do confronto ele é. `firstLeg` só vem na volta
        (`leg: SECOND`) — o placar da ida, na orientação da ida — para a UI
        mostrar o que está em jogo no agregado.
      type: object
      required: [type, stageName, leg]
      properties:
        type:      { type: string, enum: [Cup] }
        stageName: { type: string, description: 'Nome da fase, ex.: "Quinta fase", "Final"' }
        leg:       { $ref: '#/components/schemas/CupLeg' }
        firstLeg:  { $ref: '#/components/schemas/CupLegScore' }

    RoundEvent:
      description: |
        Mensagem do WebSocket `/ws/slot/{key}`. Multiplexa eventos
        de várias partidas + sinal de fim do encaixe — ou, sozinho, o
        `RoundNotStarted` quando o encaixe ainda não foi liberado (issue #151).

        Discriminado por `type` — TS exige `switch` exaustivo sobre
        todas as variantes (espelha o `when` exaustivo do `sealed
        interface RoundEvent` do backend Kotlin).
      oneOf:
        - $ref: '#/components/schemas/RoundNotStartedEvent'
        - $ref: '#/components/schemas/MatchUpdateEvent'
        - $ref: '#/components/schemas/RoundFinishedEvent'
        - $ref: '#/components/schemas/SeasonFinishedEvent'
      discriminator:
        propertyName: type
        mapping:
          RoundNotStarted: '#/components/schemas/RoundNotStartedEvent'
          MatchUpdate:     '#/components/schemas/MatchUpdateEvent'
          RoundFinished:   '#/components/schemas/RoundFinishedEvent'
          SeasonFinished:  '#/components/schemas/SeasonFinishedEvent'

    RoundNotStartedEvent:
      description: |
        O encaixe ainda está `Scheduled`: nem todos os técnicos humanos
        sinalizaram prontos e o timeout não venceu (issue #151). É a única
        mensagem da conexão, que fecha em seguida com code `1000`. Nada foi
        simulado — tabela, caixa, propostas e encaixe corrente seguem iguais.
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [RoundNotStarted] }

    MatchUpdateEvent:
      type: object
      required: [type, matchId, event]
      properties:
        type:    { type: string, enum: [MatchUpdate] }
        matchId: { type: integer, format: int64 }
        event:   { $ref: '#/components/schemas/MatchEvent' }

    RoundFinishedEvent:
      type: object
      required: [type, standings, finances, training]
      properties:
        type: { type: string, enum: [RoundFinished] }
        standings:
          type: array
          description: Tabelas atualizadas — uma por divisão, da elite para baixo.
          items: { $ref: '#/components/schemas/Standings' }
        finances:
          type: array
          description: Balanço financeiro de cada clube na rodada (bilheteria − salários).
          items: { $ref: '#/components/schemas/RoundFinance' }
        training:
          type: array
          description: |
            Extrato do treino da semana (issue #58) de TODOS os clubes — cabe
            ao cliente filtrar o do técnico. Vem vazio no replay de uma rodada
            já encerrada: os efeitos não são reaplicados.
          items: { $ref: '#/components/schemas/TrainingReport' }

    TrainingReport:
      description: |
        O que a semana de treino de um clube produziu (issue #58). Existe
        mesmo sem eventos — "treinei FISICO e ninguém evoluiu" é informação.
      type: object
      required: [clubId, focus, events]
      properties:
        clubId: { type: integer, format: int64 }
        focus:  { $ref: '#/components/schemas/TrainingFocus' }
        events:
          type: array
          items: { $ref: '#/components/schemas/TrainingEvent' }

    TrainingEvent:
      description: |
        Mapeia o `sealed interface TrainingEvent` do domínio Kotlin.
        Discriminado por `type` — o TS desambigua com `switch` exaustivo.
        Cada variante carrega o jogador JÁ com o efeito aplicado.
      oneOf:
        - $ref: '#/components/schemas/PlayerImprovedEvent'
        - $ref: '#/components/schemas/PlayerTrainingInjuryEvent'
      discriminator:
        propertyName: type
        mapping:
          Improved: '#/components/schemas/PlayerImprovedEvent'
          Injured:  '#/components/schemas/PlayerTrainingInjuryEvent'

    PlayerImprovedEvent:
      type: object
      required: [type, player, attribute]
      properties:
        type:      { type: string, enum: [Improved] }
        player:    { $ref: '#/components/schemas/Player' }
        attribute: { $ref: '#/components/schemas/TrainedAttribute' }

    PlayerTrainingInjuryEvent:
      type: object
      required: [type, player, roundsOut]
      properties:
        type:      { type: string, enum: [Injured] }
        player:    { $ref: '#/components/schemas/Player' }
        roundsOut:
          type: integer
          minimum: 1
          description: Jogos do clube de afastamento da lesão de treino.

    SeasonFinishedEvent:
      description: |
        Emitido quando a última rodada do turno encerra a temporada. Carrega
        o campeão (líder da elite — divisão 1) e as tabelas finais de todas
        as divisões. O backend já abriu a próxima temporada
        (promoção/rebaixamento aplicados, rodada 1 + tabelas zeradas) antes
        de emitir.
      type: object
      required: [type, season, champion, standings, retirements, youthPromotions, boardReviews]
      properties:
        type:     { type: string, enum: [SeasonFinished] }
        season:   { type: integer, description: Ano da temporada encerrada }
        champion: { $ref: '#/components/schemas/StandingRow' }
        standings:
          type: array
          description: Tabelas finais — uma por divisão, da elite para baixo.
          items: { $ref: '#/components/schemas/Standings' }
        retirements:
          type: array
          description: |
            Aposentadorias da virada (issue #55), de TODOS os clubes — cabe ao
            cliente filtrar o que interessa ao técnico.
          items: { $ref: '#/components/schemas/Retirement' }
        youthPromotions:
          type: array
          description: |
            Garotos que subiram da base na virada (issue #139): de 2 a 4 por
            clube, com nome e nacionalidade do país do clube, de TODOS os
            clubes — cabe ao cliente filtrar o do técnico.
          items: { $ref: '#/components/schemas/YouthPromotion' }
        cupChampion:
          $ref: '#/components/schemas/CupClub'
          description: |
            Vencedor da copa da temporada que acabou (issue #61) — o mesmo que
            vai para o histórico. Omitido quando não houve copa ou ela não
            chegou à final.
        boardReviews:
          type: array
          description: |
            Balanço da diretoria (issue #62) de TODOS os clubes com meta na
            temporada — cabe ao cliente filtrar o do técnico. O veredito
            `Fired` de um clube com dono humano já devolveu o clube à IA.
          items: { $ref: '#/components/schemas/BoardReview' }

    Retirement:
      description: |
        Um jogador pendurou as chuteiras na virada de temporada (issue #55).
        Desde a #139 a base não repõe 1:1: os garotos vêm à parte, em
        `YouthPromotion`.
      type: object
      required: [clubId, retired]
      properties:
        clubId:  { type: integer, format: int64 }
        retired: { $ref: '#/components/schemas/Player' }

    YouthPromotion:
      description: Um garoto que subiu da base ao elenco na virada de temporada (issue #139).
      type: object
      required: [clubId, player]
      properties:
        clubId: { type: integer, format: int64 }
        player: { $ref: '#/components/schemas/Player' }

    RoundFinance:
      description: |
        Receita/despesa de um clube em uma rodada (valores em centavos de USD).

        `ticketPrice` e `attendance` (issue #59) abrem a conta da bilheteria:
        com o preço sob controle do técnico, só o total não diz se a rodada
        rendeu por estádio cheio ou por ingresso caro. O preço é o do clube
        mesmo quando ele jogou fora — nesse caso público e receita são zero.
      type: object
      required: [clubId, ticketRevenue, salariesPaid, deficit, ticketPrice, attendance, cupPrize]
      properties:
        clubId:        { type: integer, format: int64 }
        ticketRevenue: { type: integer, format: int64, description: Bilheteria do mandante (0 para visitante) }
        salariesPaid:  { type: integer, format: int64, description: Folha salarial paga na rodada (0 fora do "mês" e em data de copa) }
        deficit:       { type: integer, format: int64, description: Parte da folha não coberta pelo caixa (> 0 ⇒ clube no vermelho) }
        ticketPrice:   { type: integer, format: int64, description: Preço do ingresso cobrado pelo clube na rodada }
        attendance:    { type: integer, minimum: 0, description: Público pagante do mandante (0 para visitante) }
        cupPrize:
          type: integer
          format: int64
          minimum: 0
          description: |
            Prêmio da copa ganho nesta rodada (issue #61): o vencedor de um
            confronto leva o valor da fase. 0 em rodada de liga e para quem
            perdeu, folgou ou não estava na copa. Folha salarial não é cobrada
            em data de copa.

    # ─── Diretoria (issue #62) ───────────────────────────────────────────
    BoardObjective:
      type: string
      description: |
        Objetivo da temporada, do mais ambicioso para o mais modesto: `TITLE`
        (só o título serve), `TOP_HALF` (metade de cima) e `MID_TABLE` (meio
        de tabela, longe do fundo).
      enum: [TITLE, TOP_HALF, MID_TABLE]

    BoardMood:
      type: string
      description: |
        Humor da diretoria, derivado da confiança no backend. `AT_RISK` = na
        faixa de demissão: se a temporada acabasse agora com a meta perdida, o
        técnico cairia.
      enum: [CONFIDENT, WARY, AT_RISK]

    BoardStatus:
      description: Painel da diretoria — meta da temporada e situação atual do clube.
      type: object
      required:
        - clubId
        - season
        - objective
        - targetPosition
        - currentPosition
        - onTarget
        - divisionSize
        - matchday
        - confidence
        - mood
        - bonusCents
        - firingConfidence
      properties:
        clubId:          { type: integer, format: int64 }
        season:          { type: integer, description: Temporada da meta }
        objective:       { $ref: '#/components/schemas/BoardObjective' }
        targetPosition:  { type: integer, minimum: 1, description: Terminar nesta posição ou acima cumpre a meta }
        currentPosition: { type: integer, minimum: 1, description: Posição atual na tabela da divisão }
        onTarget:        { type: boolean, description: A posição atual cumpre a meta (currentPosition <= targetPosition) }
        divisionSize:    { type: integer, minimum: 1, description: Clubes na divisão do clube }
        matchday:        { type: integer, minimum: 0, description: Rodadas de liga já disputadas (0 antes da estreia) }
        confidence:      { type: integer, minimum: 0, maximum: 100 }
        mood:            { $ref: '#/components/schemas/BoardMood' }
        bonusCents:      { type: integer, format: int64, description: Bônus em caixa por cumprir a meta }
        firingConfidence:
          type: integer
          minimum: 0
          maximum: 100
          description: Limiar de demissão — meta perdida com a confiança neste valor ou abaixo demite

    BoardVerdict:
      description: |
        Mapeia o `sealed interface BoardVerdict` do domínio: o que a diretoria
        decide ao fim da temporada. Só `TargetMet` carrega dado (o bônus pago).
        No TS, `switch (verdict.type)` exaustivo.
      oneOf:
        - $ref: '#/components/schemas/BoardTargetMetVerdict'
        - $ref: '#/components/schemas/BoardTargetMissedVerdict'
        - $ref: '#/components/schemas/BoardFiredVerdict'
      discriminator:
        propertyName: type
        mapping:
          TargetMet:    '#/components/schemas/BoardTargetMetVerdict'
          TargetMissed: '#/components/schemas/BoardTargetMissedVerdict'
          Fired:        '#/components/schemas/BoardFiredVerdict'

    BoardTargetMetVerdict:
      type: object
      required: [type, bonusCents]
      properties:
        type:       { type: string, enum: [TargetMet] }
        bonusCents: { type: integer, format: int64, description: Bônus creditado no caixa na virada }

    BoardTargetMissedVerdict:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [TargetMissed] }

    BoardFiredVerdict:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [Fired] }

    BoardReview:
      description: Balanço da diretoria sobre um clube numa temporada encerrada.
      type: object
      required: [clubId, clubName, season, objective, targetPosition, finalPosition, confidence, verdict]
      properties:
        clubId:         { type: integer, format: int64 }
        clubName:       { type: string }
        season:         { type: integer }
        objective:      { $ref: '#/components/schemas/BoardObjective' }
        targetPosition: { type: integer, minimum: 1 }
        finalPosition:  { type: integer, minimum: 1 }
        confidence:     { type: integer, minimum: 0, maximum: 100, description: Confiança ao apito final }
        verdict:        { $ref: '#/components/schemas/BoardVerdict' }

    Dismissal:
      description: |
        Demissão do técnico (issue #62) — o "game over" da v1. O clube já
        voltou para a IA; o técnico pode recomeçar reivindicando outro.
      type: object
      required: [clubId, clubName, season, objective, targetPosition, finalPosition]
      properties:
        clubId:         { type: integer, format: int64, description: Clube de onde foi demitido }
        clubName:       { type: string }
        season:         { type: integer, description: Temporada do fracasso }
        objective:      { $ref: '#/components/schemas/BoardObjective' }
        targetPosition: { type: integer, minimum: 1 }
        finalPosition:  { type: integer, minimum: 1 }

    # ─── Copa (issues #61 e #131) ────────────────────────────────────────
    CupLegs:
      type: string
      description: Formato dos confrontos de uma fase — jogo único ou ida e volta.
      enum: [SINGLE, TWO_LEGGED]

    CupLeg:
      type: string
      description: |
        Qual jogo do confronto uma partida de copa é. `SINGLE` (jogo único:
        empate vai aos pênaltis), `FIRST` (ida: empate é só placar) ou `SECOND`
        (volta: pênaltis só com o agregado empatado; não há gol fora de casa).
      enum: [SINGLE, FIRST, SECOND]

    CupLegScore:
      description: Placar de UM jogo, na orientação mandante × visitante daquele jogo.
      type: object
      required: [homeGoals, awayGoals]
      properties:
        homeGoals: { type: integer, minimum: 0 }
        awayGoals: { type: integer, minimum: 0 }

    CupClub:
      description: Clube como a copa o registra (nome copiado — é história).
      type: object
      required: [id, name]
      properties:
        id:   { type: integer, format: int64 }
        name: { type: string }

    PenaltyScore:
      description: Placar de uma disputa de pênaltis (nunca empatado).
      type: object
      required: [home, away]
      properties:
        home: { type: integer, minimum: 0 }
        away: { type: integer, minimum: 0 }

    TieResult:
      description: |
        Resultado de um confronto em jogo único. Empate no placar sempre vem
        com `penalties`; vitória no tempo normal nunca.
      type: object
      required: [homeGoals, awayGoals]
      properties:
        homeGoals: { type: integer, minimum: 0 }
        awayGoals: { type: integer, minimum: 0 }
        penalties: { $ref: '#/components/schemas/PenaltyScore' }

    CupAggregate:
      description: Gols somados nos jogos já disputados, na orientação do CONFRONTO (`home` = mandante da ida).
      type: object
      required: [home, away]
      properties:
        home: { type: integer, minimum: 0 }
        away: { type: integer, minimum: 0 }

    CupTie:
      description: |
        Mapeia o `sealed interface CupTie` do domínio: um confronto da chave é
        `Single` (jogo único) ou `TwoLegged` (ida e volta). `home` é o
        mandante do jogo único ou da IDA — na volta o mando se inverte.
      oneOf:
        - $ref: '#/components/schemas/CupSingleTie'
        - $ref: '#/components/schemas/CupTwoLeggedTie'
      discriminator:
        propertyName: type
        mapping:
          Single:    '#/components/schemas/CupSingleTie'
          TwoLegged: '#/components/schemas/CupTwoLeggedTie'

    CupSingleTie:
      type: object
      required: [type, index, home, away]
      properties:
        type:   { type: string, enum: [Single] }
        index:  { type: integer, minimum: 0 }
        home:   { $ref: '#/components/schemas/CupClub' }
        away:   { $ref: '#/components/schemas/CupClub' }
        result:
          $ref: '#/components/schemas/TieResult'
          description: Omitido enquanto o confronto não foi disputado
        winnerId:
          type: integer
          format: int64
          description: |
            Quem passou (pênaltis incluídos), decidido no backend. Omitido
            enquanto o confronto não foi disputado.

    CupTwoLeggedTie:
      description: |
        Ida e volta. `firstLeg`/`secondLeg` na orientação de CADA jogo (como
        na súmula: na volta o mandante é `away`); `aggregate` e `penalties` na
        orientação do confronto. Pênaltis só existem com o agregado empatado.
      type: object
      required: [type, index, home, away]
      properties:
        type:      { type: string, enum: [TwoLegged] }
        index:     { type: integer, minimum: 0 }
        home:      { $ref: '#/components/schemas/CupClub' }
        away:      { $ref: '#/components/schemas/CupClub' }
        firstLeg:
          $ref: '#/components/schemas/CupLegScore'
          description: Omitido enquanto a ida não foi disputada
        secondLeg:
          $ref: '#/components/schemas/CupLegScore'
          description: Omitido enquanto a volta não foi disputada
        aggregate:
          $ref: '#/components/schemas/CupAggregate'
          description: Omitido antes da ida
        penalties:
          $ref: '#/components/schemas/PenaltyScore'
          description: Disputa ao fim da volta, na orientação do confronto
        winnerId:
          type: integer
          format: int64
          description: Quem passou, decidido no backend. Omitido até a volta decidir.

    CupStage:
      description: Uma fase já sorteada, com os confrontos na ordem do sorteio.
      type: object
      required: [name, legs, ties]
      properties:
        name: { type: string }
        legs: { $ref: '#/components/schemas/CupLegs' }
        ties:
          type: array
          items: { $ref: '#/components/schemas/CupTie' }

    CupPhaseInfo:
      description: |
        Uma fase do plano da copa (sorteada ou não): quantos clubes, jogo único
        ou ida e volta, quem ENTRA nela (os mais fortes nas fases mais
        tardias) e o prêmio de quem vence um confronto dela.
      type: object
      required: [name, teams, legs, entrants, prizeCents]
      properties:
        name:  { type: string }
        teams: { type: integer, minimum: 2 }
        legs:  { $ref: '#/components/schemas/CupLegs' }
        entrants:
          type: array
          items: { $ref: '#/components/schemas/CupClub' }
        prizeCents: { type: integer, format: int64, minimum: 0, description: Prêmio por confronto vencido (centavos de USD) }

    Cup:
      description: |
        Copa mata-mata da temporada (issues #61 e #131). `phases` lista a copa
        inteira (com entrantes e prêmio de cada fase) para a UI desenhar a
        chave completa; `stages` só as fases já sorteadas, alinhadas por
        índice com `phases` — a seguinte é sorteada quando a anterior termina.
        `currentStage` (nome da fase em disputa) é omitido quando a copa
        acabou; `champion`, enquanto ela não acabou.
      type: object
      required: [season, competitionId, competitionName, phases, stages]
      properties:
        season:          { type: integer }
        competitionId:   { type: string }
        competitionName: { type: string }
        phases:
          type: array
          items: { $ref: '#/components/schemas/CupPhaseInfo' }
        stages:
          type: array
          items: { $ref: '#/components/schemas/CupStage' }
        currentStage: { type: string }
        champion:     { $ref: '#/components/schemas/CupClub' }

    ReadinessStatus:
      description: |
        Prontidão da rodada em liga compartilhada (issue #20). Se a simulação
        pode destravar vem pronto em `canStart` (issue #98) — o cliente não
        recalcula o gate. O cliente sabe se é a sua vez verificando se o
        próprio username está em `pendingUsernames`.

        **Escape hatch (issue #45):** um único técnico offline não trava mais a
        liga. Assim que o primeiro técnico sinaliza pronto, começa a correr um
        timeout; ao chegar a zero (`timedOut`), a rodada pode iniciar mesmo com
        pendentes — os ausentes entram com a última escalação salva.
      type: object
      required: [readyCount, totalCount, pendingUsernames, timedOut, allReady, canStart]
      properties:
        matchday:
          type: string
          description: 'Chave do encaixe ao qual a prontidão se refere (issue #125); ausente sem rodada no calendário'
        readyCount:       { type: integer, minimum: 0, description: Técnicos que já sinalizaram pronto }
        totalCount:       { type: integer, minimum: 0, description: Total de técnicos humanos (donos de clube) }
        pendingUsernames:
          type: array
          description: Usernames que ainda não sinalizaram
          items: { type: string }
        secondsRemaining:
          type: integer
          minimum: 0
          nullable: true
          description: |
            Segundos até o auto-start do escape hatch (issue #45). `null` quando
            o cronômetro não está armado — ninguém pronto ainda, ou todos já
            prontos (aí o gate normal libera).
        timedOut:
          type: boolean
          description: |
            O timeout expirou: a rodada pode iniciar apesar dos pendentes
            (ausentes entram com a última escalação salva).
        allReady:
          type: boolean
          description: |
            Todos os técnicos humanos sinalizaram pronto (`totalCount > 0` e
            `readyCount >= totalCount`; liga sem técnico nunca está pronta).
            Calculado pelo backend (issue #98).
        canStart:
          type: boolean
          description: |
            Gate efetivo do `POST /round/play`: `allReady` OU `timedOut`. Com
            `false`, o play responde 409 `ROUND_NOT_READY`. Calculado pelo
            backend (issue #98) — é o mesmo valor que o servidor usa no gate.

    # --- #132 Libertadores ---
    GroupRoundStage:
      description: |
        Rodada da fase de grupos de uma continental (issue #132): o grupo e a
        rodada DELE (1..6 na Libertadores). Não mexe na tabela da liga nem
        decide nada nos pênaltis.
      type: object
      required: [type, groupName, matchday]
      properties:
        type:      { type: string, enum: [Group] }
        groupName: { type: string, example: Grupo A }
        matchday:  { type: integer, minimum: 1 }

    ContinentalTitle:
      description: Um título continental registrado na história (issue #132).
      type: object
      required: [competitionId, competitionName, champion]
      properties:
        competitionId:   { type: string, example: conmebol-libertadores }
        competitionName: { type: string }
        champion:        { $ref: '#/components/schemas/CupClub' }

    GroupFixture:
      description: Um jogo de grupo. O placar só vem depois de disputado.
      type: object
      required: [round, homeClubId, homeClubName, awayClubId, awayClubName]
      properties:
        round:        { type: integer, minimum: 1 }
        homeClubId:   { type: integer, format: int64 }
        homeClubName: { type: string }
        awayClubId:   { type: integer, format: int64 }
        awayClubName: { type: string }
        homeGoals:    { type: integer, minimum: 0 }
        awayGoals:    { type: integer, minimum: 0 }

    ContinentalGroup:
      type: object
      required: [name, rows, fixtures]
      properties:
        name: { type: string, example: Grupo A }
        rows:
          type: array
          description: 'Tabela do grupo, ordenada; os classificados com `zone: QUALIFICATION`'
          items: { $ref: '#/components/schemas/StandingRow' }
        fixtures:
          type: array
          description: Os jogos do grupo em ordem de rodada (turno e returno)
          items: { $ref: '#/components/schemas/GroupFixture' }

    Venue:
      description: Estádio real do pack (nome e capacidade).
      type: object
      required: [name, capacity]
      properties:
        name:     { type: string }
        capacity: { type: integer, minimum: 1 }

    Libertadores:
      description: |
        Uma edição da Copa Libertadores (issue #132). `knockout` é omitido
        enquanto os grupos não acabam; `champion`, enquanto a final não foi
        disputada. Os prêmios das fases (`knockout.phases[].prizeCents`) são
        o dobro dos da copa nacional.
      type: object
      required: [season, competitionId, competitionName, qualifiersPerGroup, groups]
      properties:
        season:             { type: integer }
        competitionId:      { type: string, example: conmebol-libertadores }
        competitionName:    { type: string }
        qualifiersPerGroup: { type: integer, minimum: 1 }
        groups:
          type: array
          items: { $ref: '#/components/schemas/ContinentalGroup' }
        knockout:   { $ref: '#/components/schemas/Cup' }
        finalVenue: { $ref: '#/components/schemas/Venue' }
        champion:   { $ref: '#/components/schemas/CupClub' }

    # --- #133 Navegação do mundo ---
    CompetitionFormatType:
      type: string
      description: |
        Formato da competição (espelha o `sealed CompetitionFormat` do domínio,
        issue #124). A UI escolhe as visões por ele, com `switch` exaustivo:
        `ROUND_ROBIN` tem tabela; `KNOCKOUT` tem chave;
        `GROUPS_THEN_KNOCKOUT` tem grupos e chave (Libertadores, #132);
        `SWISS_LEAGUE` tem tabela e chave (Champions, #145).
      enum: [ROUND_ROBIN, KNOCKOUT, GROUPS_THEN_KNOCKOUT, SWISS_LEAGUE]

    CompetitionKindType:
      type: string
      description: |
        Papel da competição no mundo (espelha o `sealed CompetitionKind`):
        liga do país, copa nacional ou continental (dona é a confederação).
      enum: [LEAGUE, NATIONAL_CUP, CONTINENTAL]

    Tiebreaker:
      type: string
      description: |
        Critério de classificação, na ordem em que a competição o aplica
        (issue #124). A tabela já chega ordenada; a UI só lista os critérios.
      enum: [POINTS, WINS, GOAL_DIFFERENCE, GOALS_FOR, HEAD_TO_HEAD, HEAD_TO_HEAD_GOAL_DIFFERENCE, FEWER_RED_CARDS, FEWER_YELLOW_CARDS, DRAWING_OF_LOTS]

    CompetitionSummary:
      description: Uma competição do catálogo do save, na temporada corrente (issue #133).
      type: object
      required: [id, name, format, kind, confederation, clubCount]
      properties:
        id:     { type: string, example: bra-serie-a }
        name:   { type: string, example: Campeonato Brasileiro Série A }
        format: { $ref: '#/components/schemas/CompetitionFormatType' }
        kind:   { $ref: '#/components/schemas/CompetitionKindType' }
        country:
          $ref: '#/components/schemas/Country'
          description: País da competição; ausente nas continentais
        confederation: { $ref: '#/components/schemas/Confederation' }
        tier:
          type: integer
          minimum: 1
          description: Divisão no país (1 = elite); só nas ligas
        season:
          type: integer
          description: Ano de INÍCIO da temporada corrente; ausente se o país ainda não começou
        seasonLabel:
          type: string
          description: '`2026` ou `2026/27`; ausente junto com `season`'
        clubCount:
          type: integer
          minimum: 0
          description: Clubes que disputam a temporada corrente

    CompetitionDetail:
      description: |
        Uma competição com as regras que a tela mostra (issue #133). Mesmos
        campos de `CompetitionSummary` + os critérios de desempate e o limite
        de estrangeiros.
      type: object
      required: [id, name, format, kind, confederation, clubCount, tiebreakers]
      properties:
        id:     { type: string, example: bra-serie-a }
        name:   { type: string, example: Campeonato Brasileiro Série A }
        format: { $ref: '#/components/schemas/CompetitionFormatType' }
        kind:   { $ref: '#/components/schemas/CompetitionKindType' }
        country:
          $ref: '#/components/schemas/Country'
          description: País da competição; ausente nas continentais
        confederation: { $ref: '#/components/schemas/Confederation' }
        tier:
          type: integer
          minimum: 1
          description: Divisão no país (1 = elite); só nas ligas
        season:
          type: integer
          description: Ano de INÍCIO da temporada corrente; ausente se o país ainda não começou
        seasonLabel:
          type: string
          description: '`2026` ou `2026/27`; ausente junto com `season`'
        clubCount:
          type: integer
          minimum: 0
          description: Clubes que disputam a temporada corrente
        tiebreakers:
          type: array
          description: Critérios de desempate da tabela, em ordem (o primeiro é sempre `POINTS`)
          items: { $ref: '#/components/schemas/Tiebreaker' }
        foreignPlayerLimit:
          type: integer
          minimum: 0
          description: Máximo de estrangeiros em campo por jogo; ausente = sem limite

    CompetitionMatchday:
      description: |
        Um encaixe da temporada de uma competição e os jogos dela nele
        (issue #133). `matches` vazio = fase de mata-mata ainda não sorteada.
      type: object
      required: [matchday, matches]
      properties:
        matchday: { $ref: '#/components/schemas/Matchday' }
        matches:
          type: array
          items: { $ref: '#/components/schemas/RoundMatch' }

    CompetitionScorer:
      description: |
        Um artilheiro dos clubes da competição (issue #133). `goals` são os
        gols da temporada do jogador em TODAS as competições (corte do MVP).
      type: object
      required: [playerId, playerName, clubId, clubName, goals]
      properties:
        playerId:   { type: integer, format: int64 }
        playerName: { type: string }
        clubId:     { type: integer, format: int64 }
        clubName:   { type: string }
        goals:      { type: integer, minimum: 1 }

    ScheduleWeek:
      description: |
        Uma semana do calendário do clube (issue #133): semana ISO, de
        segunda a domingo, se é data FIFA e os jogos do clube nela, em ordem.
      type: object
      required: [year, week, start, end, fifaWindow, matches]
      properties:
        year:  { type: integer, description: Ano da SEMANA ISO }
        week:  { type: integer, minimum: 1, maximum: 53 }
        start: { type: string, format: date, description: Segunda-feira }
        end:   { type: string, format: date, description: Domingo }
        fifaWindow:
          type: boolean
          description: |
            A semana é (ou toca) uma data FIFA. Ligas que pausam não jogam
            nela; o Brasileirão segue.
        matches:
          type: array
          items: { $ref: '#/components/schemas/NextMatch' }

    ClubSchedule:
      description: Calendário do clube nas próximas semanas (issue #133).
      type: object
      required: [clubId, weeks]
      properties:
        clubId:  { type: integer, format: int64 }
        current:
          $ref: '#/components/schemas/Matchday'
          description: Encaixe corrente do jogo; ausente sem calendário
        weeks:
          type: array
          items: { $ref: '#/components/schemas/ScheduleWeek' }
    # --- fim #133 ---

    # ─── Error ────────────────────────────────────────────────────────────
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            Código estável para o cliente discriminar (não a mensagem).
            Ex.: `CLUB_NOT_FOUND`, `INVALID_LINEUP`, `INSUFFICIENT_FUNDS`.

            Códigos genéricos, válidos em qualquer endpoint (issue #81):
            - `MALFORMED_REQUEST` (400): corpo JSON inválido ou que não
              desserializa (sintaxe, campo obrigatório ausente, enum/formação
              desconhecida). `details.reason` traz a causa.
            - `INVALID_PARAMETER` (400): parâmetro de query/path com tipo ou
              valor inválido (ex.: `?position=XX`). `details.parameter` e
              `details.value` identificam o parâmetro.
            - `NOT_FOUND` (404): rota inexistente.
            - `METHOD_NOT_ALLOWED` (405): método HTTP não suportado na rota.
            - `INTERNAL_ERROR` (500): erro inesperado no servidor; mensagem
              genérica, sem detalhes internos.
        message:
          type: string
          description: Mensagem humana (pode ser exibida ao usuário)
        details:
          type: object
          additionalProperties: true
          description: Dados extras dependentes do código de erro

    # --- #137 Janelas de transferência ---
    TransferWindowClosed:
      description: |
        A janela de transferência do clube está fechada (issue #137): a do
        comprador na compra e nas propostas, a do vendedor na venda ao
        mercado. Também sai na janela SÓ DOMÉSTICA quando o vendedor é de
        outro país — aí `nextOpens` é a próxima janela internacional.
        `nextOpens` ausente: a federação não tem calendário de janelas.
      type: object
      required: [type]
      properties:
        type:      { type: string, enum: [TransferWindowClosed] }
        nextOpens: { type: string, format: date, description: Próxima abertura (ISO-8601) }

    TransferLimitReached:
      description: |
        O jogador já esgotou o limite simplificado de registros (issue #137):
        um por janela e dois por temporada. Registro = entrar num clube
        (compra no mercado ou proposta aceita).
      type: object
      required: [type, playerId, limit]
      properties:
        type:     { type: string, enum: [TransferLimitReached] }
        playerId: { type: integer, format: int64 }
        limit:    { $ref: '#/components/schemas/RegistrationLimit' }

    RegistrationLimit:
      type: string
      enum: [ONE_PER_WINDOW, TWO_PER_SEASON]
      description: |
        `ONE_PER_WINDOW` — o jogador já foi registrado nesta janela.
        `TWO_PER_SEASON` — já foram dois registros na temporada do comprador
        (ano civil no Brasil; de junho a maio na UEFA).

    TransferWindowScope:
      type: string
      enum: [DOMESTIC_ONLY, INTERNATIONAL]
      description: |
        `DOMESTIC_ONLY` — só transferências entre clubes da própria federação
        (a CBF abre uma em março). `INTERNATIONAL` — qualquer transferência.

    TransferWindowStatus:
      description: |
        Mapeia `sealed interface WindowStatus` do domínio (issue #137).
        Discriminado por `type` — no TS, `switch (status.type)` exaustivo.
      oneOf:
        - $ref: '#/components/schemas/OpenTransferWindow'
        - $ref: '#/components/schemas/ClosedTransferWindow'
      discriminator:
        propertyName: type
        mapping:
          Open:   '#/components/schemas/OpenTransferWindow'
          Closed: '#/components/schemas/ClosedTransferWindow'

    OpenTransferWindow:
      type: object
      required: [type, closes, scope]
      properties:
        type:   { type: string, enum: [Open] }
        closes: { type: string, format: date, description: Último dia da janela (inclusivo) }
        scope:  { $ref: '#/components/schemas/TransferWindowScope' }

    ClosedTransferWindow:
      type: object
      required: [type]
      properties:
        type:      { type: string, enum: [Closed] }
        nextOpens: { type: string, format: date, description: 'Próxima abertura; ausente se a federação não tem calendário' }
    # --- fim #137 ---

    # --- #134 Seleções ---
    InternationalDutyStatus:
      type: object
      description: |
        Convocado pela seleção numa data FIFA (issue #134): fora de TODOS os
        jogos do clube até `until` (último dia da janela). Volta quando o
        relógio sai da janela, com a stamina gasta nos jogos da seleção e,
        às vezes, lesionado.
      required: [type, country, until]
      properties:
        type: { type: string, enum: [OnInternationalDuty] }
        country:
          type: string
          pattern: '^[A-Z]{3}$'
          description: Trigrama FIFA da seleção que convocou
          example: BRA
        until:
          type: string
          format: date
          description: Último dia da data FIFA
          example: '2026-03-31'

    FifaWindowStatus:
      type: string
      description: |
        Situação de uma data FIFA no save: `UPCOMING` (ainda não chegou — a
        lista de convocados é só prévia), `CALLED` (convocados com as
        seleções, jogos por disputar), `PLAYED` (jogada, convocados de volta).
      enum: [UPCOMING, CALLED, PLAYED]

    FifaWindowSummary:
      type: object
      description: Uma data FIFA. As ligas que pausam não jogam nas semanas que ela toca.
      required: [start, end, status, matchSlots]
      properties:
        start: { type: string, format: date, example: '2026-03-23' }
        end:   { type: string, format: date, example: '2026-03-31' }
        status: { $ref: '#/components/schemas/FifaWindowStatus' }
        matchSlots:
          type: integer
          description: Jogos de seleção na janela — 4 em setembro/outubro, 2 nas demais
          example: 2

    CalledUpPlayer:
      type: object
      description: |
        Um convocado. Nome, posição, overall e clube são a foto da convocação
        (a lista continua legível se o jogador mudar de clube depois).
      required: [playerId, name, position, overall, clubId, clubName, country]
      properties:
        playerId: { type: integer, format: int64 }
        name:     { type: string }
        position: { $ref: '#/components/schemas/Position' }
        overall:  { type: integer, minimum: 0, maximum: 99 }
        clubId:   { type: integer, format: int64 }
        clubName: { type: string }
        country:  { $ref: '#/components/schemas/Country' }

    ClubCallUps:
      type: object
      required: [players]
      properties:
        window: { $ref: '#/components/schemas/FifaWindowSummary' }
        players:
          type: array
          description: Convocados do clube (vazia quando ninguém foi chamado)
          items: { $ref: '#/components/schemas/CalledUpPlayer' }

    NationalMatchKind:
      type: string
      description: Jogo de Eliminatórias (CONMEBOL) ou amistoso
      enum: [QUALIFIER, FRIENDLY]

    NationalMatch:
      type: object
      description: Jogo de seleção já disputado (simulação rápida).
      required: [home, away, kind, matchNumber, homeGoals, awayGoals]
      properties:
        home: { $ref: '#/components/schemas/Country' }
        away: { $ref: '#/components/schemas/Country' }
        kind: { $ref: '#/components/schemas/NationalMatchKind' }
        matchNumber:
          type: integer
          minimum: 1
          description: Ordem do jogo na janela (1..4)
        qualifierRound:
          type: integer
          minimum: 1
          maximum: 18
          description: Rodada das Eliminatórias — ausente nos amistosos
        homeGoals: { type: integer, minimum: 0 }
        awayGoals: { type: integer, minimum: 0 }

    NationalTableRow:
      type: object
      description: |
        Linha da classificação das Eliminatórias ou do ranking de seleções.
        No ranking, jogo de Eliminatórias vale o dobro dos pontos de um
        amistoso. Ordem: pontos, saldo, gols pró.
      required: [position, country, played, won, drawn, lost, goalsFor, goalsAgainst, goalDifference, points]
      properties:
        position: { type: integer, minimum: 1 }
        country:  { $ref: '#/components/schemas/Country' }
        played:   { type: integer }
        won:      { type: integer }
        drawn:    { type: integer }
        lost:     { type: integer }
        goalsFor: { type: integer }
        goalsAgainst: { type: integer }
        goalDifference: { type: integer }
        points:   { type: integer }

    QualifiersTable:
      type: object
      description: |
        Eliminatórias da CONMEBOL do ciclo corrente: 10 seleções em turno e
        returno, 18 rodadas distribuídas pelas datas FIFA de dois anos.
      required: [cycle, roundsPlayed, totalRounds, rows]
      properties:
        cycle:
          type: integer
          description: Ano de início do ciclo (2026, 2028…)
        roundsPlayed: { type: integer, minimum: 0 }
        totalRounds:  { type: integer, example: 18 }
        rows:
          type: array
          items: { $ref: '#/components/schemas/NationalTableRow' }

    NationalTeamsOverview:
      type: object
      required: [windows, lastResults, qualifiers, ranking]
      properties:
        windows:
          type: array
          description: Datas FIFA do ano corrente do jogo e do seguinte, em ordem
          items: { $ref: '#/components/schemas/FifaWindowSummary' }
        nextWindow: { $ref: '#/components/schemas/FifaWindowSummary' }
        lastWindow: { $ref: '#/components/schemas/FifaWindowSummary' }
        lastResults:
          type: array
          description: Jogos da última data FIFA disputada (vazia antes da primeira)
          items: { $ref: '#/components/schemas/NationalMatch' }
        qualifiers: { $ref: '#/components/schemas/QualifiersTable' }
        ranking:
          type: array
          description: Ranking de seleções — só quem já jogou aparece
          items: { $ref: '#/components/schemas/NationalTableRow' }

    # --- #136 ---
    Contract:
      type: object
      description: |
        Contrato em vigor do jogador (issue #136). O vínculo é com o clube
        dono do elenco; o salário fica em `Player.salary`. Dura de 1 a 5
        temporadas (no máximo 3 para menor de 18) e termina sempre no fim de
        temporada da liga do clube — 31/12 no Brasil, 31/05 nas ligas
        europeias. Ao vencer, na virada daquela liga, o jogador sai livre.
      required: [start, end, finalSeason]
      properties:
        start:
          type: string
          format: date
          example: '2026-01-01'
        end:
          type: string
          format: date
          description: Último dia do contrato — um fim de temporada da liga do clube
          example: '2028-12-31'
        releaseClause:
          type: integer
          format: int64
          minimum: 1
          description: Cláusula de rescisão, em centavos de USD — ausente quando não há
        finalSeason:
          type: boolean
          description: |
            `true` quando o contrato está na última temporada (vence na próxima
            virada da liga do clube). Calculado pelo backend a partir da data
            do jogo — a UI só destaca.

    # --- #138 ---
    ContractOffer:
      type: object
      description: |
        Termos pessoais oferecidos ao jogador (issue #138) — na compra de um
        livre, na proposta entre técnicos e na renovação. Na `TransferOffer`,
        são os termos que o jogador JÁ aceitou (ausentes numa proposta
        anterior à issue). Uma duração fora do que o jogador topa não é erro de
        validação: é a resposta dele (`TOO_SHORT`/`TOO_LONG`).
      required: [salary, years]
      properties:
        salary:
          type: integer
          format: int64
          minimum: 0
          maximum: 10000000000
          # Exemplo explícito: sem ele o Swagger UI sugere o `maximum` (US$ 100
          # milhões/mês), e um "Execute" desavisado assinaria esse salário.
          example: 300000
          description: |
            Salário mensal oferecido, em centavos de USD. Acima do teto de
            US$ 100 milhões é 400 `INVALID_CONTRACT_OFFER`.
        years:
          type: integer
          description: |
            Duração em temporadas — a corrente conta como a primeira, e o
            contrato termina no fim de temporada da liga do clube.
          example: 3
        releaseClause:
          type: integer
          format: int64
          minimum: 1
          example: 50000000
          description: Cláusula de rescisão, em centavos de USD — opcional

    RefusalReason:
      type: string
      enum: [LOW_SALARY, TOO_SHORT, TOO_LONG, WEAKER_CLUB, LOWER_LEAGUE]
      description: |
        `LOW_SALARY` — salário abaixo do que ele pede.
        `TOO_SHORT` / `TOO_LONG` — duração fora de `minYears..maxYears`.
        `WEAKER_CLUB` — o clube que oferece é muito mais fraco que o dele, e o
        salário não cobre o prêmio por descer (+50%).
        `LOWER_LEAGUE` — a liga é muito mais fraca que a dele, e o salário não
        cobre o prêmio por descer (+30%).

    PlayerRefused:
      description: |
        O jogador recusou os termos (issue #138) — nada foi aplicado. A
        resposta é determinística e explica o porquê: `demandedSalary` é o
        salário que fecharia o negócio com uma duração em
        `minYears..maxYears`. `cooldownUntil` só existe na renovação, quando a
        oferta foi ofensiva (menos de 75% do pedido e menos do que ele ganha): até essa data (exclusive)
        o jogador não ouve nova proposta.
      type: object
      required: [type, playerId, reason, demandedSalary, minYears, maxYears]
      properties:
        type:           { type: string, enum: [PlayerRefused] }
        playerId:       { type: integer, format: int64 }
        reason:         { $ref: '#/components/schemas/RefusalReason' }
        demandedSalary: { type: integer, format: int64, description: Salário mensal pedido, em centavos de USD }
        minYears:       { type: integer, description: Menor duração que ele aceita, em temporadas }
        maxYears:       { type: integer, description: Maior duração que ele aceita, em temporadas }
        cooldownUntil:  { type: string, format: date }

    RenewalResult:
      description: |
        Resultado da renovação (issue #138). Discriminado por `type` — o
        frontend usa `switch (result.type)` exaustivo. Posse (403), existência
        do clube (404) e termos malformados (400) viram status HTTP.
      oneOf:
        - $ref: '#/components/schemas/ContractRenewed'
        - $ref: '#/components/schemas/PlayerRefused'
        - $ref: '#/components/schemas/TalksCoolingDown'
        - $ref: '#/components/schemas/PlayerNotAvailable'
        - $ref: '#/components/schemas/TransferConflict'
      discriminator:
        propertyName: type
        mapping:
          Renewed:            '#/components/schemas/ContractRenewed'
          PlayerRefused:      '#/components/schemas/PlayerRefused'
          TalksCoolingDown:   '#/components/schemas/TalksCoolingDown'
          PlayerNotAvailable: '#/components/schemas/PlayerNotAvailable'
          Conflict:           '#/components/schemas/TransferConflict'

    ContractRenewed:
      description: Contrato novo assinado — `player` traz o contrato e o salário novos.
      type: object
      required: [type, player]
      properties:
        type:   { type: string, enum: [Renewed] }
        player: { $ref: '#/components/schemas/Player' }

    TalksCoolingDown:
      description: |
        O jogador ainda está "esfriado" por uma oferta ofensiva anterior e não
        ouve proposta de renovação antes de `until` (exclusive).
      type: object
      required: [type, playerId, until]
      properties:
        type:     { type: string, enum: [TalksCoolingDown] }
        playerId: { type: integer, format: int64 }
        until:    { type: string, format: date }
