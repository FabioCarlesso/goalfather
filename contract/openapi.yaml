openapi: 3.1.0
info:
  title: GoalFather API
  version: 0.1.0
  description: |
    Contrato compartilhado entre o backend (Kotlin + Spring Boot) e o frontend
    (Vite + React + TypeScript). Esta é a fonte de verdade dos tipos da API.

    - **Backend:** springdoc-openapi valida que a implementação Spring bate com
      este spec. `sealed interface MatchEvent` em Kotlin é serializado com
      `@JsonClassDiscriminator("type")` (kotlinx.serialization), mapeando
      diretamente para `oneOf + discriminator` aqui.
    - **Frontend:** `openapi-typescript` gera `src/api/generated.d.ts` a partir
      deste arquivo. Mocks MSW e cliente HTTP usam esses tipos.

    Mudanças no contrato são feitas aqui PRIMEIRO; backend e frontend ajustam
    suas implementações para acompanhar.
  license:
    name: MIT
    identifier: MIT
  contact:
    name: Fabio Carlesso
    email: fabio.carlesso@gmail.com

servers:
  - url: http://localhost:8080
    description: Backend Spring Boot local (bootRun)
  - url: http://localhost:5173
    description: Frontend Vite com MSW interceptando (dev mock)

tags:
  - name: Auth
    description: Cadastro, login e identidade do usuário (JWT)
  - name: Club
    description: Estado e gestão do clube do usuário
  - name: Match
    description: Disputa e streaming de partidas
  - name: Market
    description: Mercado de transferências
  - name: Stadium
    description: Infraestrutura do clube
  - name: Medical
    description: Departamento médico — recuperação de fadiga e lesões
  - name: Training
    description: Treino semanal — foco escolhido pelo técnico entre rodadas
  - name: League
    description: Tabela e calendário do campeonato

paths:
  /api/auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Cadastrar novo usuário
      description: |
        Cria um usuário com senha (hash BCrypt no backend) e devolve um JWT
        já autenticado. O usuário nasce sem clube (`clubId = null`) — o
        próximo passo é reivindicar um clube em `/api/clubs/{id}/claim`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Usuário criado e autenticado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: Username já em uso (`USERNAME_TAKEN`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Autenticar usuário existente
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Autenticado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401':
          description: Credenciais inválidas (`INVALID_CREDENTIALS`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: Identidade do usuário autenticado
      description: |
        Recupera o usuário a partir do JWT no header `Authorization`.
        Usado pelo frontend para restaurar a sessão após refresh e decidir
        se redireciona para `/select-club` (quando `clubId == null`).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Usuário autenticado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthUser' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/clubs/available:
    get:
      tags: [Club]
      operationId: listAvailableClubs
      summary: Clubes sem dono (disponíveis para reivindicar)
      description: |
        Lista os clubes com `ownerId == null`, com metadados para o card de
        seleção (caixa, capacidade do estádio, força média do elenco).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Clubes disponíveis
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AvailableClub' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/clubs/{id}/claim:
    post:
      tags: [Club]
      operationId: claimClub
      summary: Reivindicar um clube para o usuário autenticado
      description: |
        Marca o clube como pertencente ao usuário autenticado e grava o
        `clubId` no usuário. Transacional com lock otimista: se dois usuários
        tentarem reivindicar o mesmo clube simultaneamente, o segundo recebe
        `409 CLUB_ALREADY_CLAIMED`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ClubIdPath'
      responses:
        '200':
          description: Clube reivindicado — devolve o usuário atualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthUser' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Clube já reivindicado (`CLUB_ALREADY_CLAIMED`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/clubs/{id}:
    get:
      tags: [Club]
      operationId: getClub
      summary: Estado completo do clube
      description: Retorna clube com elenco, caixa, estádio e escalação atual.
      parameters:
        - $ref: '#/components/parameters/ClubIdPath'
      responses:
        '200':
          description: Clube encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Club' }
        '404':
          $ref: '#/components/responses/NotFound'

  /api/clubs/{id}/lineup:
    post:
      tags: [Club]
      operationId: saveLineup
      summary: Salvar escalação, formação e postura
      description: |
        Define os 11 titulares, a formação e a postura da partida. A ordem do
        array `playerIds` deve corresponder aos slots da formação escolhida
        (ver `Formation`).

        A postura (issue #56) é gravada JUNTO da escalação, numa única
        operação — a engine da rodada lê as duas do mesmo estado persistido.
        Omitir `posture` mantém `BALANCED`.
      parameters:
        - $ref: '#/components/parameters/ClubIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LineupRequest' }
      responses:
        '204':
          description: Escalação salva
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/clubs/{id}/matches:
    post:
      tags: [Match]
      operationId: playMatch
      summary: Jogar uma partida da rodada
      description: |
        Dispara a simulação síncrona da partida desta rodada e retorna o resumo.
        Para acompanhar evento a evento em tempo real, conecte-se ao WebSocket
        `/ws/matches/{id}` (ver `x-websocket` abaixo).
      parameters:
        - $ref: '#/components/parameters/ClubIdPath'
        - name: round
          in: query
          required: true
          description: Número da rodada (1..N)
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Partida concluída
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MatchSummary' }
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Partida da rodada já disputada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/clubs/{id}/stadium/expand:
    post:
      tags: [Stadium]
      operationId: expandStadium
      summary: Ampliar capacidade do estádio
      description: |
        Investe caixa do clube para aumentar a capacidade do estádio.
        Falha com `INSUFFICIENT_FUNDS` se o caixa for insuficiente.
      parameters:
        - $ref: '#/components/parameters/ClubIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpandStadiumRequest' }
      responses:
        '200':
          description: Estádio ampliado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Club' }
        '402':
          description: Caixa insuficiente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          $ref: '#/components/responses/NotFound'

  /api/clubs/{id}/medical:
    post:
      tags: [Medical]
      operationId: treatSquad
      summary: Sessão do departamento médico
      description: |
        Paga a taxa fixa de R$ 30.000 (3000000 centavos) e acelera a
        recuperação do elenco (issue #54): todo jogador ganha +30 de stamina
        (teto 100) e as lesões em curso encurtam uma rodada. Falha com
        `INSUFFICIENT_FUNDS` se o caixa não cobrir a taxa.
      parameters:
        - $ref: '#/components/parameters/ClubIdPath'
      responses:
        '200':
          description: Elenco tratado — devolve o clube já atualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Club' }
        '402':
          description: Caixa insuficiente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Usuário não é dono do clube
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          $ref: '#/components/responses/NotFound'

  /api/clubs/{id}/training:
    post:
      tags: [Training]
      operationId: setTrainingFocus
      summary: Escolher o foco de treino da semana
      description: |
        Registra o foco de treino do clube (issue #58). O efeito não acontece
        aqui: ele entra na virada da rodada, junto do desgaste físico — e
        exatamente uma vez, sob o mesmo claim que protege os demais efeitos.
        Quem nunca escolheu (e todo clube da IA) treina em `DESCANSO`.
      parameters:
        - $ref: '#/components/parameters/ClubIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TrainingFocusRequest' }
      responses:
        '200':
          description: Foco registrado — devolve o clube já atualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Club' }
        '403':
          description: Usuário não é dono do clube
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          $ref: '#/components/responses/NotFound'

  /api/market:
    get:
      tags: [Market]
      operationId: listMarket
      summary: Jogadores disponíveis no mercado
      parameters:
        - name: position
          in: query
          required: false
          description: Filtra por posição
          schema: { $ref: '#/components/schemas/Position' }
        - name: maxPrice
          in: query
          required: false
          description: Preço máximo de compra
          schema: { type: integer, minimum: 0 }
      responses:
        '200':
          description: Lista de jogadores disponíveis
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MarketEntry' }

  /api/market/buy:
    post:
      tags: [Market]
      operationId: buyPlayer
      summary: Contratar jogador do mercado
      description: |
        Devolve um `TransferResult` como union — `Success` traz o clube
        atualizado e o jogador contratado; variantes de erro indicam o motivo.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BuyPlayerRequest' }
      responses:
        '200':
          description: Resultado da operação (sucesso ou erro de negócio)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferResult' }
        '404':
          $ref: '#/components/responses/NotFound'

  /api/market/sell:
    post:
      tags: [Market]
      operationId: sellPlayer
      summary: Vender jogador do elenco
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SellPlayerRequest' }
      responses:
        '200':
          description: Resultado da operação
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferResult' }
        '404':
          $ref: '#/components/responses/NotFound'

  /api/league/standings:
    get:
      tags: [League]
      operationId: getStandings
      summary: Tabelas de classificação do campeonato (uma por divisão)
      description: |
        Sem `season`, retorna as tabelas da temporada ativa. Com `season`,
        retorna as tabelas finais de uma temporada já encerrada (histórico).
        Uma tabela por divisão, ordenadas da elite (divisão 1) para baixo.
      parameters:
        - name: season
          in: query
          required: false
          description: Ano da temporada (omitido = temporada ativa)
          schema: { type: integer }
      responses:
        '200':
          description: |
            Tabelas por divisão; cada uma ordenada por pontos, saldo, gols pró
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Standings' }
        '404':
          description: Temporada inexistente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/league/round/current:
    get:
      tags: [League]
      operationId: getCurrentRound
      summary: Estado atual da rodada
      description: |
        Retorna os pareamentos da rodada corrente. Cada partida tem seu
        próprio `matchId`. Para acompanhar ao vivo, conecte-se em
        `/ws/round/{number}` após chamar `playRound`.
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Round' }

  /api/league/round/readiness:
    get:
      tags: [League]
      operationId: getRoundReadiness
      summary: Prontidão da rodada (lobby)
      description: |
        Estado de "todos prontos → joga rodada" da liga compartilhada
        (issue #20). Alimenta o card de lobby; o cliente refaz a busca após
        sinalizar pronto (ou recebe push via WS de lobby, opcional).
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadinessStatus' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/league/round/ready:
    post:
      tags: [League]
      operationId: markRoundReady
      summary: Sinalizar que o técnico está pronto
      description: |
        O técnico autenticado declara estar pronto para a rodada corrente
        (issue #20). Idempotente. Devolve o estado de prontidão atualizado.
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadinessStatus' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/league/round/play:
    post:
      tags: [League]
      operationId: playRound
      summary: Iniciar simulação da rodada
      description: |
        Marca a rodada corrente como `InProgress` e devolve o número
        para o cliente conectar no WebSocket. Em liga compartilhada só
        destrava quando TODOS os técnicos humanos sinalizaram prontos
        (issue #20); caso contrário retorna 409 `ROUND_NOT_READY`.
        Idempotente enquanto a rodada não termina.
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required: [roundNumber]
                properties:
                  roundNumber: { type: integer, minimum: 1 }
        '409':
          description: |
            Rodada já encerrada (`ROUND_ALREADY_FINISHED`) ou ainda
            aguardando técnicos (`ROUND_NOT_READY` — `details` traz
            `ready`, `total` e `pending`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /ws/round/{number}:
    get:
      tags: [League]
      operationId: streamRound
      summary: '[WebSocket] Stream de eventos da rodada'
      description: |
        **ATENÇÃO: endpoint WebSocket.** Multiplexa eventos de TODAS as
        partidas da rodada em um único canal. Cada mensagem é um
        `RoundEvent` (`MatchUpdate` carregando um `MatchEvent` + matchId,
        ou `RoundFinished` no encerramento com a tabela atualizada).

        Esta escolha de design (um WS por rodada em vez de N WS por
        partida) facilita a coordenação no backend Kotlin: um único
        `Flow<RoundEvent>` orquestra todas as simulações em paralelo.
      parameters:
        - name: number
          in: path
          required: true
          description: Número da rodada
          schema: { type: integer, minimum: 1 }
        - name: token
          in: query
          required: true
          description: |
            JWT de autenticação (issue #27). O browser não envia o header
            `Authorization` no handshake de WebSocket, então o token viaja aqui.
            Handshake sem token válido é rejeitado com 401.
          schema: { type: string }
      responses:
        '101':
          description: Switching Protocols — WebSocket estabelecido
        '200':
          description: |
            Não é uma resposta real; documentado para que o cliente
            tenha o tipo `RoundEvent` gerado pelo `openapi-typescript`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoundEvent' }
      x-websocket:
        protocol: ws
        messages:
          serverToClient:
            schema: { $ref: '#/components/schemas/RoundEvent' }

  /ws/matches/{id}:
    get:
      tags: [Match]
      operationId: streamMatch
      summary: '[WebSocket] Stream de eventos da partida ao vivo'
      description: |
        **ATENÇÃO: endpoint WebSocket**, não HTTP. OpenAPI 3.1 não modela WS
        oficialmente, então documentamos aqui apenas o formato das mensagens
        para que o frontend tenha tipos gerados e o backend tenha referência.

        - **URL real:** `ws://host:8080/ws/matches/{id}`
        - **Direção:** servidor → cliente (read-only)
        - **Formato:** uma mensagem JSON por evento, com o schema `MatchEvent`
        - **Encerramento:** servidor fecha após enviar `FullTime`
      parameters:
        - name: id
          in: path
          required: true
          description: ID da partida em andamento
          schema: { type: integer, format: int64 }
        - name: token
          in: query
          required: true
          description: |
            JWT de autenticação (issue #27). O browser não envia o header
            `Authorization` no handshake de WebSocket, então o token viaja aqui.
            Handshake sem token válido é rejeitado com 401.
          schema: { type: string }
      responses:
        '101':
          description: Switching Protocols — conexão WebSocket estabelecida
        '200':
          description: |
            Não é uma resposta real; documentado apenas para que
            `openapi-typescript` gere o tipo `MatchEvent` consumido no cliente.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MatchEvent' }
      x-websocket:
        protocol: ws
        messages:
          serverToClient:
            schema: { $ref: '#/components/schemas/MatchEvent' }

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT emitido por `/api/auth/register` ou `/api/auth/login`. Enviado em
        `Authorization: Bearer <token>`. Todos os `/api/**` exigem o token,
        exceto `/api/auth/register` e `/api/auth/login`.

  parameters:
    ClubIdPath:
      name: id
      in: path
      required: true
      description: ID do clube
      schema: { type: integer, format: int64 }

  responses:
    NotFound:
      description: Recurso não encontrado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ValidationError:
      description: Payload inválido
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Token ausente ou inválido
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:

    # ─── Auth ──────────────────────────────────────────────────────────────
    RegisterRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 30
        password:
          type: string
          minLength: 6
          maxLength: 100

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }

    AuthUser:
      type: object
      required: [id, username]
      properties:
        id:       { type: integer, format: int64 }
        username: { type: string }
        clubId:
          type: integer
          format: int64
          nullable: true
          description: Clube reivindicado pelo usuário; `null` antes da seleção.

    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
          description: 'JWT para o header Authorization: Bearer <token>.'
        user: { $ref: '#/components/schemas/AuthUser' }

    AvailableClub:
      description: Resumo de um clube sem dono, para o card de seleção.
      type: object
      required: [id, name, cash, stadiumCapacity, averageOverall, division]
      properties:
        id:              { type: integer, format: int64 }
        name:            { type: string }
        cash:            { type: integer, format: int64, description: Caixa em centavos }
        stadiumCapacity: { type: integer, minimum: 0 }
        averageOverall:
          type: integer
          minimum: 0
          maximum: 99
          description: Força média do elenco (média dos `overall`).
        division:
          type: integer
          minimum: 1
          description: 'Divisão em que o clube disputa a temporada (1 = elite)'

    # ─── Enums ─────────────────────────────────────────────────────────────
    Position:
      type: string
      description: Posição do jogador no campo
      enum: [GK, CB, MF, FW]
      x-labels:
        GK: GL
        CB: ZG
        MF: MC
        FW: AT

    Formation:
      type: string
      description: |
        Esquema tático (define ordem das posições nos slots). Desde a issue #56
        a formação também pesa na simulação: 4-3-3 e 3-5-2 inclinam o time ao
        ataque, 5-3-2 à defesa e 4-4-2 é o eixo neutro. O peso é menor que o da
        `Posture` — a formação inclina, a postura decide.
      enum: ['4-4-2', '4-3-3', '3-5-2', '5-3-2']

    Posture:
      type: string
      description: |
        Postura do time na partida (issue #56) — a decisão tática por rodada,
        salva junto da escalação.

        `OFFENSIVE` aumenta a chance de gol dos DOIS times (jogo aberto);
        `DEFENSIVE` reduz as duas, cedendo menos do que deixa de criar — é o
        que torna "fechar o time" racional contra adversário mais forte.
        Os multiplicadores vivem no backend (`enum class Posture`); o cliente
        só escolhe e exibe.
      enum: [DEFENSIVE, BALANCED, OFFENSIVE]
      default: BALANCED
      x-labels:
        DEFENSIVE: Defensiva
        BALANCED: Equilibrada
        OFFENSIVE: Ofensiva

    TrainingFocus:
      type: string
      description: |
        Foco do treino da semana (issue #58) — a decisão de gestão ENTRE
        rodadas, diferente da `Posture`, que é a decisão da partida.

        `ATAQUE`/`DEFESA` dão a alguns jogadores uma chance pequena de +1 no
        atributo correspondente (jovens aproveitam mais), devolvem pouca forma
        física e cobram risco pequeno de lesão leve. `FISICO` fica no meio:
        recupera bem a stamina, desenvolve velocidade e é o que mais machuca.
        `DESCANSO` é o único sem risco, e o que mais recupera. Nenhum foco
        apaga o desgaste de quem jogou (a fadiga continua acumulando), e
        nenhum recupera zero — foco técnico custa forma física, mas não deixa
        o time preso no piso. Os números vivem no backend
        (`enum class TrainingFocus`); o cliente só escolhe e exibe.
      enum: [ATAQUE, DEFESA, FISICO, DESCANSO]
      default: DESCANSO
      x-labels:
        ATAQUE: Ataque
        DEFESA: Defesa
        FISICO: Físico
        DESCANSO: Descanso

    TrainedAttribute:
      type: string
      description: Atributo desenvolvido por um foco de treino (issue #58).
      enum: [SHOOTING, DEFENDING, PACE]
      x-labels:
        SHOOTING: Finalização
        DEFENDING: Marcação
        PACE: Velocidade

    # ─── Player & Club ────────────────────────────────────────────────────
    Player:
      type: object
      required:
        - id
        - name
        - position
        - overall
        - pace
        - shooting
        - passing
        - defending
        - stamina
        - salary
        - age
        - goals
        - yellowCards
        - redCards
        - availability
      properties:
        id:         { type: integer, format: int64 }
        name:       { type: string }
        position:   { $ref: '#/components/schemas/Position' }
        overall:    { type: integer, minimum: 0, maximum: 99 }
        pace:       { type: integer, minimum: 0, maximum: 99 }
        shooting:   { type: integer, minimum: 0, maximum: 99 }
        passing:    { type: integer, minimum: 0, maximum: 99 }
        defending:  { type: integer, minimum: 0, maximum: 99 }
        stamina:
          type: integer
          minimum: 0
          maximum: 100
          description: |
            Forma física (issue #54). Titulares perdem 10–25 por rodada (piso
            40) e reservas recuperam. Abaixo de 70 o rendimento do jogador cai
            proporcionalmente — a UI não recalcula isso, só exibe.
        salary:     { type: integer, minimum: 0, description: Salário mensal }
        age:
          type: integer
          minimum: 15
          maximum: 50
          description: |
            Idade (issue #55). Na virada de temporada todo jogador ganha um ano:
            até 23 tende a evoluir, de 24 a 29 oscila pouco e a partir dos 30
            tende a regredir. Veterano de overall baixo se aposenta e sai do
            elenco — a UI não recalcula nada disso, só exibe.
        goals:      { type: integer, minimum: 0, description: Gols na temporada }
        yellowCards: { type: integer, minimum: 0, description: Cartões amarelos na temporada }
        redCards:    { type: integer, minimum: 0, description: Cartões vermelhos na temporada }
        availability: { $ref: '#/components/schemas/Availability' }
        star:
          type: boolean
          description: Derivado de `overall >= 82` (computado pelo backend)

    Availability:
      description: |
        Disponibilidade do jogador (issue #54). `oneOf` + `discriminator`
        espelhando o `sealed interface Availability` do domínio Kotlin: a
        duração da lesão só existe DENTRO da variante `Injured`, então não há
        como representar "lesionado sem duração". No TS, desambigua com
        `switch (player.availability.type)` exaustivo.
      oneOf:
        - $ref: '#/components/schemas/AvailableStatus'
        - $ref: '#/components/schemas/InjuredStatus'
      discriminator:
        propertyName: type
        mapping:
          Available: '#/components/schemas/AvailableStatus'
          Injured:   '#/components/schemas/InjuredStatus'

    AvailableStatus:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [Available] }

    InjuredStatus:
      type: object
      required: [type, roundsOut]
      properties:
        type: { type: string, enum: [Injured] }
        roundsOut:
          type: integer
          minimum: 1
          description: Rodadas restantes de afastamento; chega a zero e o jogador volta.

    Lineup:
      type: object
      required: [formation, playerIds]
      properties:
        formation:
          $ref: '#/components/schemas/Formation'
        playerIds:
          type: array
          minItems: 0
          maxItems: 11
          items: { type: integer, format: int64 }
          description: |
            IDs dos titulares em ordem correspondente aos slots da formação.
        posture:
          $ref: '#/components/schemas/Posture'
          description: |
            Postura salva com a escalação (issue #56). O backend sempre a
            devolve — escalação gravada antes da tática existir desserializa
            no default. Opcional no schema porque o cliente pode ter omitido
            ao salvar; ausente, trate como `BALANCED`.

    Club:
      type: object
      required:
        - id
        - name
        - cash
        - stadiumCapacity
        - squad
        # Sempre presente: quem nunca escolheu vem com o default `DESCANSO`,
        # então o cliente nunca precisa adivinhar o foco em vigor.
        - trainingFocus
      properties:
        id:               { type: integer, format: int64 }
        name:             { type: string }
        cash:             { type: integer, format: int64, description: Caixa em centavos }
        stadiumCapacity:  { type: integer, minimum: 0 }
        squad:
          type: array
          items: { $ref: '#/components/schemas/Player' }
        lineup:
          $ref: '#/components/schemas/Lineup'
          description: Escalação salva (pode estar incompleta)
        ownerId:
          type: integer
          format: int64
          nullable: true
          description: |
            Dono humano do clube; `null` significa controlado pela IA.
            Preparado para multiplayer (Fase 5).
        trainingFocus:
          $ref: '#/components/schemas/TrainingFocus'
          description: |
            Foco de treino em vigor (issue #58). Vale entre rodadas e para o
            elenco inteiro — fica valendo até o técnico trocar.

    # ─── Requests ─────────────────────────────────────────────────────────
    LineupRequest:
      type: object
      required: [formation, playerIds]
      properties:
        formation: { $ref: '#/components/schemas/Formation' }
        playerIds:
          type: array
          minItems: 11
          maxItems: 11
          items: { type: integer, format: int64 }
        posture:
          $ref: '#/components/schemas/Posture'
          description: Postura da partida; omitida, o backend assume `BALANCED`.

    TrainingFocusRequest:
      type: object
      required: [focus]
      properties:
        focus: { $ref: '#/components/schemas/TrainingFocus' }

    ExpandStadiumRequest:
      type: object
      required: [additionalSeats]
      properties:
        additionalSeats:
          type: integer
          minimum: 1000
          description: Quantidade de novos assentos a adicionar

    BuyPlayerRequest:
      type: object
      required: [clubId, playerId]
      properties:
        clubId:   { type: integer, format: int64 }
        playerId: { type: integer, format: int64 }

    SellPlayerRequest:
      type: object
      required: [clubId, playerId]
      properties:
        clubId:   { type: integer, format: int64 }
        playerId: { type: integer, format: int64 }

    # ─── Market ───────────────────────────────────────────────────────────
    MarketEntry:
      type: object
      required: [player, price]
      properties:
        player: { $ref: '#/components/schemas/Player' }
        price:
          type: integer
          format: int64
          description: Preço de compra (em centavos)

    TransferResult:
      description: |
        Mapeia `sealed interface TransferResult` no domínio Kotlin.
        Discriminado por `type` — frontend usa `switch (result.type)` exaustivo.
      oneOf:
        - $ref: '#/components/schemas/TransferSuccess'
        - $ref: '#/components/schemas/InsufficientFunds'
        - $ref: '#/components/schemas/SquadFull'
        - $ref: '#/components/schemas/PlayerNotAvailable'
      discriminator:
        propertyName: type
        mapping:
          Success:            '#/components/schemas/TransferSuccess'
          InsufficientFunds:  '#/components/schemas/InsufficientFunds'
          SquadFull:          '#/components/schemas/SquadFull'
          PlayerNotAvailable: '#/components/schemas/PlayerNotAvailable'

    TransferSuccess:
      type: object
      required: [type, club, player]
      properties:
        type:   { type: string, enum: [Success] }
        club:   { $ref: '#/components/schemas/Club' }
        player: { $ref: '#/components/schemas/Player' }

    InsufficientFunds:
      type: object
      required: [type, available, required]
      properties:
        type:      { type: string, enum: [InsufficientFunds] }
        available: { type: integer, format: int64 }
        required:  { type: integer, format: int64 }

    SquadFull:
      type: object
      required: [type, maxSize]
      properties:
        type:    { type: string, enum: [SquadFull] }
        maxSize: { type: integer }

    PlayerNotAvailable:
      type: object
      required: [type, playerId]
      properties:
        type:     { type: string, enum: [PlayerNotAvailable] }
        playerId: { type: integer, format: int64 }

    # ─── Match (sealed MatchEvent + summary) ─────────────────────────────
    MatchEvent:
      description: |
        Mapeia `sealed interface MatchEvent` no domínio Kotlin. Cada mensagem
        do WebSocket `/ws/matches/{id}` é um `MatchEvent` serializado.

        Discriminado por `type` — frontend usa `switch (event.type)` exaustivo
        (TS infere o tipo correto em cada branch).
      oneOf:
        - $ref: '#/components/schemas/KickOffEvent'
        - $ref: '#/components/schemas/GoalEvent'
        - $ref: '#/components/schemas/MissEvent'
        - $ref: '#/components/schemas/CardEvent'
        - $ref: '#/components/schemas/InjuryEvent'
        - $ref: '#/components/schemas/SaveEvent'
        - $ref: '#/components/schemas/FullTimeEvent'
      discriminator:
        propertyName: type
        mapping:
          KickOff:  '#/components/schemas/KickOffEvent'
          Goal:     '#/components/schemas/GoalEvent'
          Miss:     '#/components/schemas/MissEvent'
          Card:     '#/components/schemas/CardEvent'
          Injury:   '#/components/schemas/InjuryEvent'
          Save:     '#/components/schemas/SaveEvent'
          FullTime: '#/components/schemas/FullTimeEvent'

    MatchEventBase:
      type: object
      required: [type, minute]
      properties:
        type:   { type: string }
        minute: { type: integer, minimum: 0, maximum: 120 }

    KickOffEvent:
      description: |
        Primeiro evento do stream. Carrega metadados da partida (nome, força
        agregada e postura dos times) para que o cliente possa renderizar o
        placar antes que outros eventos cheguem.
      allOf:
        - $ref: '#/components/schemas/MatchEventBase'
        - type: object
          required:
            - type
            - homeClubName
            - awayClubName
            - homeStrength
            - awayStrength
            - homePosture
            - awayPosture
          properties:
            type:         { type: string, enum: [KickOff] }
            homeClubName: { type: string }
            awayClubName: { type: string }
            homeStrength: { type: number, minimum: 0, maximum: 99 }
            awayStrength: { type: number, minimum: 0, maximum: 99 }
            homePosture:
              $ref: '#/components/schemas/Posture'
              description: |
                Postura com que o mandante entrou em campo (issue #56) — é como
                o técnico descobre que o adversário se fechou contra ele.
            awayPosture:
              $ref: '#/components/schemas/Posture'
              description: Postura com que o visitante entrou em campo.

    GoalEvent:
      allOf:
        - $ref: '#/components/schemas/MatchEventBase'
        - type: object
          required: [type, scorerId, home]
          properties:
            type:     { type: string, enum: [Goal] }
            scorerId: { type: integer, format: int64 }
            home:
              type: boolean
              description: true = gol do mandante; false = visitante

    MissEvent:
      description: |
        Chute para fora (issue #57). Autor sorteado com o mesmo peso por
        posição do gol — goleiro não finaliza.
      allOf:
        - $ref: '#/components/schemas/MatchEventBase'
        - type: object
          required: [type, playerId, home]
          properties:
            type:     { type: string, enum: [Miss] }
            playerId: { type: integer, format: int64 }
            home:
              type: boolean
              description: true = finalização do mandante; false = do visitante

    CardEvent:
      allOf:
        - $ref: '#/components/schemas/MatchEventBase'
        - type: object
          required: [type, playerId, red, home]
          properties:
            type:     { type: string, enum: [Card] }
            playerId: { type: integer, format: int64 }
            red:      { type: boolean, description: true = vermelho; false = amarelo }
            home:
              type: boolean
              description: |
                Lado do jogador advertido (issue #57). Necessário para as
                estatísticas de disciplina do `FullTime`, já que o `playerId`
                sozinho não diz a que elenco ele pertence.

    InjuryEvent:
      allOf:
        - $ref: '#/components/schemas/MatchEventBase'
        - type: object
          required: [type, playerId, roundsOut]
          properties:
            type:     { type: string, enum: [Injury] }
            playerId: { type: integer, format: int64 }
            roundsOut:
              type: integer
              minimum: 1
              description: |
                Rodadas de afastamento sorteadas com o RNG da própria partida
                (issue #54). Viaja no evento para que o replay do stream
                reproduza exatamente a mesma lesão.

    SaveEvent:
      description: |
        Defesa do goleiro. `home` é o lado de QUEM DEFENDEU — a finalização
        veio do outro time (issue #57).
      allOf:
        - $ref: '#/components/schemas/MatchEventBase'
        - type: object
          required: [type, home]
          properties:
            type: { type: string, enum: [Save] }
            goalkeeperId:
              type: integer
              format: int64
              nullable: true
              description: |
                Goleiro que defendeu. Ausente/nulo apenas quando o time entrou
                em campo sem goleiro escalado (elenco incompleto).
            home:
              type: boolean
              description: true = defesa do goleiro do mandante

    FullTimeEvent:
      description: |
        Apito final. Além do placar, carrega o sumário da partida (issue #57)
        — derivado dos próprios eventos emitidos, nunca calculado à parte.
      allOf:
        - $ref: '#/components/schemas/MatchEventBase'
        - type: object
          required: [type, homeGoals, awayGoals, stats]
          properties:
            type:      { type: string, enum: [FullTime] }
            homeGoals: { type: integer, minimum: 0 }
            awayGoals: { type: integer, minimum: 0 }
            stats:     { $ref: '#/components/schemas/MatchStats' }

    MatchStats:
      description: Estatísticas dos dois lados, na mesma orientação do placar.
      type: object
      required: [home, away]
      properties:
        home: { $ref: '#/components/schemas/TeamStats' }
        away: { $ref: '#/components/schemas/TeamStats' }

    TeamStats:
      description: |
        Números de um time na partida. Projeção do stream de eventos: nada
        aqui é estado próprio, então o sumário nunca diverge do feed.
      type: object
      required: [shots, shotsOnTarget, saves, yellowCards, redCards]
      properties:
        shots:
          type: integer
          minimum: 0
          description: 'Finalizações: gols + defesas do goleiro adversário + chutes para fora'
        shotsOnTarget:
          type: integer
          minimum: 0
          description: 'Delas, as que foram no gol: gols + defesas do goleiro adversário'
        saves:
          type: integer
          minimum: 0
          description: Defesas feitas pelo goleiro DESTE time
        yellowCards: { type: integer, minimum: 0 }
        redCards:    { type: integer, minimum: 0 }

    MatchSummary:
      type: object
      required:
        - matchId
        - round
        - homeClubId
        - awayClubId
        - homeGoals
        - awayGoals
        - events
        - attendance
        - ticketRevenue
      properties:
        matchId:       { type: integer, format: int64 }
        round:         { type: integer, minimum: 1 }
        homeClubId:    { type: integer, format: int64 }
        awayClubId:    { type: integer, format: int64 }
        homeGoals:     { type: integer, minimum: 0 }
        awayGoals:     { type: integer, minimum: 0 }
        events:
          type: array
          items: { $ref: '#/components/schemas/MatchEvent' }
        attendance:
          type: integer
          minimum: 0
          description: Público pagante
        ticketRevenue:
          type: integer
          format: int64
          description: Receita de bilheteria (em centavos)

    # ─── League ───────────────────────────────────────────────────────────
    StandingRow:
      type: object
      required:
        - position
        - clubId
        - clubName
        - played
        - wins
        - draws
        - losses
        - goalsFor
        - goalsAgainst
        - goalDifference
        - points
      properties:
        position:        { type: integer, minimum: 1 }
        clubId:          { type: integer, format: int64 }
        clubName:        { type: string }
        played:          { type: integer, minimum: 0 }
        wins:            { type: integer, minimum: 0 }
        draws:           { type: integer, minimum: 0 }
        losses:          { type: integer, minimum: 0 }
        goalsFor:        { type: integer, minimum: 0 }
        goalsAgainst:    { type: integer, minimum: 0 }
        goalDifference:  { type: integer }
        points:          { type: integer, minimum: 0 }

    Standings:
      description: |
        Tabela de UMA divisão em uma temporada. `promotionSpots` /
        `relegationSpots` dizem quantas posições do topo/fundo trocam de
        divisão na virada — a UI pinta as zonas a partir deles, sem duplicar
        a regra de negócio no cliente. São 0 quando não há para onde subir
        (elite) ou descer (última divisão).
      type: object
      required: [season, division, round, rows, promotionSpots, relegationSpots]
      properties:
        season:   { type: integer, description: Ano da temporada }
        division: { type: integer, minimum: 1, description: 'Divisão (1 = elite)' }
        round:    { type: integer, minimum: 0, description: Rodada atual concluída }
        promotionSpots:
          type: integer
          minimum: 0
          description: Posições do topo que sobem de divisão na virada (0 na elite)
        relegationSpots:
          type: integer
          minimum: 0
          description: Posições do fundo que descem de divisão na virada (0 na última)
        rows:
          type: array
          items: { $ref: '#/components/schemas/StandingRow' }

    RoundStatus:
      type: string
      description: Estado da rodada ou de uma partida da rodada
      enum: [Scheduled, InProgress, Finished]

    RoundMatch:
      description: |
        Estado de uma partida individual dentro de uma rodada. A rodada é
        global: cada divisão contribui com as próprias partidas, e `division`
        permite à UI agrupá-las.
      type: object
      required:
        - matchId
        - homeClubId
        - awayClubId
        - homeClubName
        - awayClubName
        - status
        - homeGoals
        - awayGoals
        - minute
        - division
      properties:
        matchId:       { type: integer, format: int64 }
        homeClubId:    { type: integer, format: int64 }
        awayClubId:    { type: integer, format: int64 }
        homeClubName:  { type: string }
        awayClubName:  { type: string }
        status:        { $ref: '#/components/schemas/RoundStatus' }
        homeGoals:     { type: integer, minimum: 0 }
        awayGoals:     { type: integer, minimum: 0 }
        minute:        { type: integer, minimum: 0, maximum: 120 }
        division:      { type: integer, minimum: 1, description: 'Divisão da partida (1 = elite)' }

    Round:
      type: object
      required: [number, season, status, matches]
      properties:
        number:  { type: integer, minimum: 1 }
        season:  { type: integer }
        status:  { $ref: '#/components/schemas/RoundStatus' }
        matches:
          type: array
          items: { $ref: '#/components/schemas/RoundMatch' }

    RoundEvent:
      description: |
        Mensagem do WebSocket `/ws/round/{number}`. Multiplexa eventos
        de várias partidas + sinal de fim de rodada.

        Discriminado por `type` — TS exige `switch` exaustivo sobre
        ambas as variantes (espelha o `when` exaustivo do `sealed
        interface RoundEvent` que o backend Kotlin terá).
      oneOf:
        - $ref: '#/components/schemas/MatchUpdateEvent'
        - $ref: '#/components/schemas/RoundFinishedEvent'
        - $ref: '#/components/schemas/SeasonFinishedEvent'
      discriminator:
        propertyName: type
        mapping:
          MatchUpdate:    '#/components/schemas/MatchUpdateEvent'
          RoundFinished:  '#/components/schemas/RoundFinishedEvent'
          SeasonFinished: '#/components/schemas/SeasonFinishedEvent'

    MatchUpdateEvent:
      type: object
      required: [type, matchId, event]
      properties:
        type:    { type: string, enum: [MatchUpdate] }
        matchId: { type: integer, format: int64 }
        event:   { $ref: '#/components/schemas/MatchEvent' }

    RoundFinishedEvent:
      type: object
      required: [type, standings, finances, training]
      properties:
        type: { type: string, enum: [RoundFinished] }
        standings:
          type: array
          description: Tabelas atualizadas — uma por divisão, da elite para baixo.
          items: { $ref: '#/components/schemas/Standings' }
        finances:
          type: array
          description: Balanço financeiro de cada clube na rodada (bilheteria − salários).
          items: { $ref: '#/components/schemas/RoundFinance' }
        training:
          type: array
          description: |
            Extrato do treino da semana (issue #58) de TODOS os clubes — cabe
            ao cliente filtrar o do técnico. Vem vazio no replay de uma rodada
            já encerrada: os efeitos não são reaplicados.
          items: { $ref: '#/components/schemas/TrainingReport' }

    TrainingReport:
      description: |
        O que a semana de treino de um clube produziu (issue #58). Existe
        mesmo sem eventos — "treinei FISICO e ninguém evoluiu" é informação.
      type: object
      required: [clubId, focus, events]
      properties:
        clubId: { type: integer, format: int64 }
        focus:  { $ref: '#/components/schemas/TrainingFocus' }
        events:
          type: array
          items: { $ref: '#/components/schemas/TrainingEvent' }

    TrainingEvent:
      description: |
        Mapeia o `sealed interface TrainingEvent` do domínio Kotlin.
        Discriminado por `type` — o TS desambigua com `switch` exaustivo.
        Cada variante carrega o jogador JÁ com o efeito aplicado.
      oneOf:
        - $ref: '#/components/schemas/PlayerImprovedEvent'
        - $ref: '#/components/schemas/PlayerTrainingInjuryEvent'
      discriminator:
        propertyName: type
        mapping:
          Improved: '#/components/schemas/PlayerImprovedEvent'
          Injured:  '#/components/schemas/PlayerTrainingInjuryEvent'

    PlayerImprovedEvent:
      type: object
      required: [type, player, attribute]
      properties:
        type:      { type: string, enum: [Improved] }
        player:    { $ref: '#/components/schemas/Player' }
        attribute: { $ref: '#/components/schemas/TrainedAttribute' }

    PlayerTrainingInjuryEvent:
      type: object
      required: [type, player, roundsOut]
      properties:
        type:      { type: string, enum: [Injured] }
        player:    { $ref: '#/components/schemas/Player' }
        roundsOut:
          type: integer
          minimum: 1
          description: Rodadas de afastamento da lesão de treino.

    SeasonFinishedEvent:
      description: |
        Emitido quando a última rodada do turno encerra a temporada. Carrega
        o campeão (líder da elite — divisão 1) e as tabelas finais de todas
        as divisões. O backend já abriu a próxima temporada
        (promoção/rebaixamento aplicados, rodada 1 + tabelas zeradas) antes
        de emitir.
      type: object
      required: [type, season, champion, standings, retirements]
      properties:
        type:     { type: string, enum: [SeasonFinished] }
        season:   { type: integer, description: Ano da temporada encerrada }
        champion: { $ref: '#/components/schemas/StandingRow' }
        standings:
          type: array
          description: Tabelas finais — uma por divisão, da elite para baixo.
          items: { $ref: '#/components/schemas/Standings' }
        retirements:
          type: array
          description: |
            Aposentadorias da virada (issue #55), de TODOS os clubes — cabe ao
            cliente filtrar o que interessa ao técnico.
          items: { $ref: '#/components/schemas/Retirement' }

    Retirement:
      description: |
        Um jogador pendurou as chuteiras na virada de temporada e a base do
        clube assumiu a vaga (issue #55). A reposição é 1:1 — elenco que só
        encolhe acabaria em time incompleto.
      type: object
      required: [clubId, retired, promoted]
      properties:
        clubId:   { type: integer, format: int64 }
        retired:  { $ref: '#/components/schemas/Player' }
        promoted: { $ref: '#/components/schemas/Player' }

    RoundFinance:
      description: Receita/despesa de um clube em uma rodada (valores em centavos).
      type: object
      required: [clubId, ticketRevenue, salariesPaid, deficit]
      properties:
        clubId:        { type: integer, format: int64 }
        ticketRevenue: { type: integer, format: int64, description: Bilheteria do mandante (0 para visitante) }
        salariesPaid:  { type: integer, format: int64, description: Folha salarial paga na rodada (0 fora do "mês") }
        deficit:       { type: integer, format: int64, description: Parte da folha não coberta pelo caixa (> 0 ⇒ clube no vermelho) }

    ReadinessStatus:
      description: |
        Prontidão da rodada em liga compartilhada (issue #20). A simulação
        destrava quando `readyCount == totalCount` (todos os técnicos humanos
        sinalizaram) OU quando o timeout do escape hatch expira (issue #45). O
        cliente sabe se é a sua vez verificando se o próprio username está em
        `pendingUsernames`.

        **Escape hatch (issue #45):** um único técnico offline não trava mais a
        liga. Assim que o primeiro técnico sinaliza pronto, começa a correr um
        timeout; ao chegar a zero (`timedOut`), a rodada pode iniciar mesmo com
        pendentes — os ausentes entram com a última escalação salva.
      type: object
      required: [roundNumber, readyCount, totalCount, pendingUsernames, timedOut]
      properties:
        roundNumber:      { type: integer, minimum: 0, description: Rodada à qual a prontidão se refere }
        readyCount:       { type: integer, minimum: 0, description: Técnicos que já sinalizaram pronto }
        totalCount:       { type: integer, minimum: 0, description: Total de técnicos humanos (donos de clube) }
        pendingUsernames:
          type: array
          description: Usernames que ainda não sinalizaram
          items: { type: string }
        secondsRemaining:
          type: integer
          minimum: 0
          nullable: true
          description: |
            Segundos até o auto-start do escape hatch (issue #45). `null` quando
            o cronômetro não está armado — ninguém pronto ainda, ou todos já
            prontos (aí o gate normal libera).
        timedOut:
          type: boolean
          description: |
            O timeout expirou: a rodada pode iniciar apesar dos pendentes
            (ausentes entram com a última escalação salva).

    # ─── Error ────────────────────────────────────────────────────────────
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            Código estável para o cliente discriminar (não a mensagem).
            Ex.: `CLUB_NOT_FOUND`, `INVALID_LINEUP`, `INSUFFICIENT_FUNDS`.
        message:
          type: string
          description: Mensagem humana (pode ser exibida ao usuário)
        details:
          type: object
          additionalProperties: true
          description: Dados extras dependentes do código de erro
