# GoalFather — stack completo (PostgreSQL + backend Kotlin + frontend nginx).
#
#   docker compose up --build     # sobe tudo; UI em http://localhost:8080
#   docker compose down           # para (mantém o volume do Postgres)
#   docker compose down -v        # para E zera o estado (apaga o volume)
#
# O frontend (nginx) faz proxy de /api e /ws para o backend, então só a porta
# 8080 precisa ser exposta ao host. O backend também é publicado em 8081 para
# acesso direto/depuração.
#
# Observabilidade (issue #44): um Prometheus opcional raspa /actuator/prometheus.
# Fica atrás do profile `observability`, então NÃO sobe no `up` padrão:
#   docker compose --profile observability up --build   # inclui o Prometheus
#   # Prometheus em http://localhost:9090 (tente a query `goalfather_round_simulation_seconds_count`)

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: goalfather
      POSTGRES_USER: goalfather
      POSTGRES_PASSWORD: goalfather
    volumes:
      - goalfather-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goalfather -d goalfather"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    # `dev,postgres`, não `prod`: este stack usa Postgres mas NÃO é produção
    # (credenciais fixas, portas abertas ao host). Ativar `prod` só para trocar
    # o datasource fazia o JwtSecretGuard (#30) derrubar o boot, porque o
    # segredo default é proibido fora de dev/test — ver issue #67.
    environment:
      # Lista (não mapa) para permitir o pass-through do JWT_SECRET abaixo.
      - SPRING_PROFILES_ACTIVE=dev,postgres
      - DB_URL=jdbc:postgresql://postgres:5432/goalfather
      - DB_USER=goalfather
      - DB_PASSWORD=goalfather
      # Sem `=`: a variável só é injetada se existir no host. Assim o stack local
      # sobe sem configurar nada (profile dev aceita o segredo default), e quem
      # quiser testar com um segredo real faz `export JWT_SECRET=...` antes do up.
      - JWT_SECRET
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    # Contexto na RAIZ (não em ./frontend) para que `contract/openapi.yaml` entre
    # no build: os tipos TS são gerados dele, e não de um `generated.d.ts` do
    # disco — que é gitignorado e pode estar desatualizado (issue #65).
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

  # Coletor opcional de métricas (issue #44). Só sobe com `--profile observability`.
  prometheus:
    image: prom/prometheus:v3.1.0
    profiles: ["observability"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  goalfather-pgdata:
