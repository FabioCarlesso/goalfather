name: CI

# Roda em todo PR (qualquer branch → main) e em push para main.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Kotlin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('backend/**/*.gradle.kts', 'backend/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Test
        working-directory: backend
        run: ./gradlew test --no-daemon

  frontend-unit:
    name: Frontend (unit + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Sem package-lock.json no projeto, então cacheamos ~/.npm manualmente
      # (o cache nativo do setup-node exige lockfile).
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('frontend/package.json') }}
          restore-keys: npm-${{ runner.os }}-
      - name: Install
        working-directory: frontend
        run: npm install
      - name: Generate API types
        working-directory: frontend
        run: npm run gen:api
      - name: Unit tests
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build

  frontend-e2e:
    name: Frontend E2E (mock)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('frontend/package.json') }}
          restore-keys: npm-${{ runner.os }}-
      - name: Install
        working-directory: frontend
        run: npm install
      - name: Generate API types
        working-directory: frontend
        run: npm run gen:api
      - name: Install Playwright (chromium)
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: E2E (mock)
        working-directory: frontend
        run: npm run e2e
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # Guarda de regressão da issue #65: o build Docker do frontend gerava os tipos
  # a partir do `generated.d.ts` do disco (gitignorado) em vez do contrato, então
  # quebrava em clone limpo e passava despercebido — o CI nunca buildava imagem.
  # O checkout aqui é limpo (sem `generated.d.ts`), o que reproduz exatamente o
  # cenário. Usa `docker compose build` (não `docker build`) para validar também
  # o contexto/dockerfile declarados no compose.
  docker-frontend:
    name: Docker (imagem do frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build da imagem do frontend
        run: docker compose build frontend
