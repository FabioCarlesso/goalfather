server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: rotas do React Router (/round, /market, ...) caem no index.html
    # em vez de 404 — sem isso, recarregar uma rota interna quebra.
    location / {
        try_files $uri /index.html;
    }

    # Proxy REST para o backend (o app chama sempre /api/... same-origin).
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy WebSocket (/ws/round/{n}, /ws/matches/{id}) — exige upgrade.
    location /ws/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 600s;
    }

    # Actuator (health/info) — útil para checagens externas.
    location /actuator/ {
        proxy_pass http://backend:8080;
    }
}
