spring:
  application:
    name: goalfather

  # ─── DataSource (H2 in-memory por padrao, PostgreSQL via profile prod) ────
  datasource:
    url: jdbc:h2:mem:goalfather;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: validate   # Flyway controla o schema
    properties:
      hibernate.format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080

logging:
  level:
    com.carlesso.goalfather: DEBUG
    org.hibernate.SQL: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info

# ─── Profile prod: PostgreSQL ─────────────────────────────────────────────
---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/goalfather}
    username: ${DB_USER:goalfather}
    password: ${DB_PASSWORD:goalfather}
    driver-class-name: org.postgresql.Driver
