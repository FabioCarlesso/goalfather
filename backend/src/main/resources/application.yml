spring:
  application:
    name: goalfather

  # ─── DataSource (H2 file-based por padrao, PostgreSQL via profile prod) ────
  # File-based: o estado (compras, rodadas, ampliacoes) sobrevive a reinicios
  # do backend. Para resetar: `rm -rf backend/data/`.
  # AUTO_SERVER=TRUE permite multiplas conexoes ao mesmo arquivo; MODE=PostgreSQL
  # mantem coerencia com o profile prod. Testes usam H2 in-memory
  # (src/test/resources/application.yml), entao nao tocam neste arquivo.
  datasource:
    url: jdbc:h2:file:./data/goalfather;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: validate   # Flyway controla o schema
    properties:
      hibernate.format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080

# ─── App: CORS ────────────────────────────────────────────────────────────
# Origens permitidas no /api/** (ver CorsConfig). Lista separada por vírgula;
# sobrescreva em produção com APP_CORS_ALLOWED_ORIGINS=https://meu-dominio.
app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080}
  # ─── Auth / JWT (issue #18) ───────────────────────────────────────────────
  # Segredo HMAC-SHA256: precisa de >= 32 bytes. O default abaixo é só para
  # dev — em produção defina JWT_SECRET (ex.: `openssl rand -base64 48`).
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-me-please-0123456789-abcdefghijklmnop}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}   # 24h
  # ─── Rate limiting de autenticação (issue #43) ────────────────────────────
  # Mitiga brute force/credential stuffing no login. `login` é por IP+username
  # (só tentativas inválidas contam); `register` é por IP (throttle de criação
  # em massa). `window` aceita 30s, 1m, 1h... Premissa: instância única.
  rate-limit:
    login:
      max-attempts: ${AUTH_LOGIN_MAX_ATTEMPTS:5}
      window: ${AUTH_LOGIN_WINDOW:1m}
    register:
      # Folgado: register é por IP e, atrás de NAT/CGNAT, vários clientes
      # legítimos compartilham o mesmo IP (premissa 1 IP ≈ 1 cliente).
      max-attempts: ${AUTH_REGISTER_MAX_ATTEMPTS:20}
      window: ${AUTH_REGISTER_WINDOW:1h}
  # ─── Escape hatch para técnico ausente (issue #45) ────────────────────────
  # Tempo, a partir do primeiro técnico "pronto", após o qual a rodada destrava
  # mesmo com pendentes (ausentes entram com a última escalação salva). Evita
  # que um único dono offline trave a liga. Aceita 30s, 2m, 1h... Baixe em
  # dev/E2E (ex.: 30s) para não esperar; premissa: instância única.
  round-readiness:
    timeout: ${ROUND_READINESS_TIMEOUT:2m}

logging:
  level:
    com.carlesso.goalfather: DEBUG
    org.hibernate.SQL: INFO

management:
  endpoints:
    web:
      exposure:
        # `prometheus` habilita GET /actuator/prometheus (issue #44). health/info
        # seguem expostos; nenhum outro endpoint sensível é aberto.
        include: health,info,prometheus
  metrics:
    tags:
      # Tag comum a toda métrica exportada — facilita filtrar por serviço quando
      # múltiplas apps publicam no mesmo Prometheus.
      application: goalfather

# ─── Profile prod: PostgreSQL ─────────────────────────────────────────────
---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/goalfather}
    username: ${DB_USER:goalfather}
    password: ${DB_PASSWORD:goalfather}
    driver-class-name: org.postgresql.Driver
