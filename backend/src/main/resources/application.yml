spring:
  application:
    name: goalfather

  # ─── DataSource (H2 file-based por padrao, PostgreSQL via profile prod) ────
  # File-based: o estado (compras, rodadas, ampliacoes) sobrevive a reinicios
  # do backend. Para resetar: `rm -rf backend/data/`.
  # AUTO_SERVER=TRUE permite multiplas conexoes ao mesmo arquivo; MODE=PostgreSQL
  # mantem coerencia com o profile prod. Testes usam H2 in-memory
  # (src/test/resources/application.yml), entao nao tocam neste arquivo.
  datasource:
    url: jdbc:h2:file:./data/goalfather;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: validate   # Flyway controla o schema
    properties:
      hibernate.format_sql: true
      # Gravação em lote (issue #129): a rodada regrava o elenco de todos os
      # clubes, e sem batch cada jogador era um round-trip. Ordenar inserts e
      # updates por entidade é o que permite o Hibernate agrupá-los.
      hibernate.jdbc.batch_size: 50
      hibernate.order_inserts: true
      hibernate.order_updates: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080

# ─── App: CORS ────────────────────────────────────────────────────────────
# Origens permitidas no /api/** (ver CorsConfig). Lista separada por vírgula;
# sobrescreva em produção com APP_CORS_ALLOWED_ORIGINS=https://meu-dominio.
app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080}
  # ─── Auth / JWT (issue #18) ───────────────────────────────────────────────
  # Segredo HMAC-SHA256: precisa de >= 32 bytes. O default abaixo é só para
  # dev — em produção defina JWT_SECRET (ex.: `openssl rand -base64 48`).
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-me-please-0123456789-abcdefghijklmnop}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}   # 24h
  # ─── Rate limiting de autenticação (issue #43) ────────────────────────────
  # Mitiga brute force/credential stuffing no login. `login` é por IP+username
  # (só tentativas inválidas contam); `register` é por IP (throttle de criação
  # em massa). `window` aceita 30s, 1m, 1h... Premissa: instância única.
  rate-limit:
    login:
      max-attempts: ${AUTH_LOGIN_MAX_ATTEMPTS:5}
      window: ${AUTH_LOGIN_WINDOW:1m}
    register:
      # Folgado: register é por IP e, atrás de NAT/CGNAT, vários clientes
      # legítimos compartilham o mesmo IP (premissa 1 IP ≈ 1 cliente).
      max-attempts: ${AUTH_REGISTER_MAX_ATTEMPTS:20}
      window: ${AUTH_REGISTER_WINDOW:1h}
  # ─── Escape hatch para técnico ausente (issue #45) ────────────────────────
  # Tempo, a partir do primeiro técnico "pronto", após o qual a rodada destrava
  # mesmo com pendentes (ausentes entram com a última escalação salva). Evita
  # que um único dono offline trave a liga. Aceita 30s, 2m, 1h... Baixe em
  # dev/E2E (ex.: 30s) para não esperar; premissa: instância única.
  round-readiness:
    timeout: ${ROUND_READINESS_TIMEOUT:2m}
  # ─── Pack de dados do mundo (issue #126) ──────────────────────────────────
  # Diretório do pack lido pelo FileWorldDataProvider (ver docs/WORLD_DATA.md).
  # Relativo ao diretório de trabalho: `backend/` no bootRun. Lido só quando
  # alguém pede o mundo — pack ausente não impede o boot.
  world-data:
    path: ${WORLD_DATA_PATH:../data/world/v1}

logging:
  level:
    com.carlesso.goalfather: DEBUG
    org.hibernate.SQL: INFO

management:
  endpoints:
    web:
      exposure:
        # `prometheus` habilita GET /actuator/prometheus (issue #44). health/info
        # seguem expostos; nenhum outro endpoint sensível é aberto.
        include: health,info,prometheus
  metrics:
    tags:
      # Tag comum a toda métrica exportada — facilita filtrar por serviço quando
      # múltiplas apps publicam no mesmo Prometheus.
      application: goalfather

# ─── PostgreSQL: profile `prod` OU `postgres` ─────────────────────────────
# "Qual banco" e "isto é produção" são coisas diferentes (issue #67). O stack do
# docker-compose precisa de Postgres mas NÃO é produção — antes ele ativava
# `prod` só para trocar o datasource, e aí o JwtSecretGuard (#30) derrubava o
# boot por causa do segredo default. Com a expressão `prod | postgres`, o stack
# local sobe como `dev,postgres` (honesto: Postgres, mas ambiente de dev) e o
# `prod` continua exigindo JWT_SECRET de verdade.
---
spring:
  config:
    activate:
      on-profile: "prod | postgres"
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/goalfather}
    username: ${DB_USER:goalfather}
    password: ${DB_PASSWORD:goalfather}
    driver-class-name: org.postgresql.Driver

# ─── E2E contra o backend real: profile `e2e` (issue #101) ────────────────
# `SPRING_PROFILES_ACTIVE=dev,e2e ./gradlew bootRun` + `npm run e2e:real`. Liga o
# reset `POST /test-support/reset` (E2eStateReset), que o helper do Playwright
# chama antes de cada teste. H2 em MEMÓRIA, não o arquivo de ./data: o reset
# apaga tudo, e o save de desenvolvimento não pode ser a vítima. O SQL do reset
# é do H2 — não combine este profile com `postgres`. Vem junto de `dev`, como
# no `dev,postgres` do Docker (issue #67): o JwtSecretGuard só aceita o segredo
# default em dev/test, e E2E é ambiente de desenvolvimento.
---
spring:
  config:
    activate:
      on-profile: e2e
  datasource:
    url: jdbc:h2:mem:goalfather-e2e;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
app:
  rate-limit:
    register:
      # Cada teste cadastra um técnico do mesmo IP; 3 runs seguidos da suíte
      # passariam do limite de 20/h do default.
      max-attempts: 100000
  round-readiness:
    timeout: 5s
