<!doctype html>
<!--
  Swagger UI do GoalFather (revisão do PR #92). Mostra o contract/openapi.yaml,
  que o build copia para /openapi.yaml: a documentação É o contrato, sem uma
  spec gerada dos controllers para divergir dele. Para chamar a API, faça o
  POST /api/auth/login (ou register), copie o `token` e use "Authorize".
-->
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GoalFather API</title>
  <link rel="stylesheet" href="/webjars/swagger-ui/swagger-ui.css">
</head>
<body>
  <div id="swagger-ui"></div>
  <script src="/webjars/swagger-ui/swagger-ui-bundle.js"></script>
  <script>
    window.ui = SwaggerUIBundle({
      url: '/openapi.yaml',
      dom_id: '#swagger-ui',
      persistAuthorization: true,
    })
  </script>
</body>
</html>
