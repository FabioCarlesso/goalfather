spring:
  application:
    name: goalfather-test

  # Testes usam H2 in-memory: hermeticos, rapidos e SEM tocar o banco
  # file-based de desenvolvimento (./data/goalfather) usado pelo bootRun.
  datasource:
    url: jdbc:h2:mem:goalfather-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: validate   # Flyway controla o schema
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080

# Observabilidade (issue #44): expõe /actuator/prometheus também sob teste, para
# o MvcTest do endpoint. Espelha o application.yml principal.
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: goalfather

# Auth/JWT (issue #18) — segredo fixo de teste (>= 32 bytes para HS256).
app:
  jwt:
    secret: test-secret-0123456789-abcdefghijklmnopqrstuvwxyz-0123456789
    expiration-ms: 86400000
  # Rate limit (issue #43): login apertado para o teste de 429; register
  # afrouxado para não interferir nos demais testes que registram vários
  # usuários do mesmo IP (127.0.0.1) dentro do contexto Spring compartilhado.
  rate-limit:
    login:
      max-attempts: 5
      window: 1m
    register:
      max-attempts: 100000
      window: 1m
